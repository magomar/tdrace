# Karting World Cup Module Configuration
# Specific overrides here prevail over the general config.toml

[gameplay]
default_track = "kart_arena"
default_laps = 5
default_num_bots = 7
default_assist_profile = "arcade"

[input]
# Karts steer quicker than the Balanced default (Spec 043 Steering Speed, ms to full input)
steer_time_ms = 120.0
