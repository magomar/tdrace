[package]
name = "tdrace-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core arcade vehicle physics, track geometry, collisions, and LIDAR simulation for TDRace"

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"

[[bench]]
name = "physics_bench"
harness = false

[[bench]]
name = "collision_bench"
harness = false

[[bench]]
name = "lidar_bench"
harness = false
