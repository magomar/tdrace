[package]
name = "tdrace-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core arcade vehicle physics, track geometry, collisions, and LIDAR simulation for TDRace (facade over wheelbase and arcade-race-core)"

[dependencies]
wheelbase = { path = "../wheelbase" }
arcade-race-core = { path = "../arcade-race-core" }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
miniz_oxide = "0.8"

[build-dependencies]
serde = "1.0"
serde_json = "1.0"
miniz_oxide = "0.8"

[dev-dependencies]
serde_json = "1.0"
