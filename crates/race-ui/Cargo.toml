[package]
name = "race-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Drawing primitives for top-down racing games: track renderers, race camera, effects and HUD widgets"

[dependencies]
wheelbase = { path = "../wheelbase" }
arcade-race-core = { path = "../arcade-race-core" }
cabinet = { path = "../cabinet" }
macroquad = { version = "0.4" }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
race-kit = { path = "../race-kit" }
