<svg id="emblem-split-controller" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-split" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#33D9FF" flood-opacity="0.3" />
    </filter>
    <linearGradient id="split-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="40%" stop-color="#FFD133" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <clipPath id="split-pad-left">
      <path d="M 256,120 L 150,130 C 92,140 58,200 62,290 C 66,365 122,400 162,370 C 197,345 227,325 256,325 Z" />
    </clipPath>
    <clipPath id="split-pad-right">
      <path d="M 256,120 L 362,130 C 420,140 454,200 450,290 C 446,365 390,400 350,370 C 315,345 285,325 256,325 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#080A10" stroke="#182030" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#FFD133" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.3" />

  <g filter="url(#shadow-split)">
    <!-- Controller Outer Rim -->
    <path d="M 148,126 C 200,118 312,118 364,126 C 424,136 460,198 456,292 C 452,370 392,408 350,376 C 316,350 286,331 256,331 C 226,331 196,350 162,376 C 120,408 60,370 56,292 C 52,198 88,136 148,126 Z" fill="url(#split-gold)" />

    <!-- LEFT HALF: Deep Carbon Fiber with Neon Cyan D-Pad & Stick -->
    <g clip-path="url(#split-pad-left)">
      <rect x="50" y="110" width="210" height="300" fill="#0E121B" />
      <g opacity="0.08" stroke="#FFFFFF" stroke-width="2">
        <line x1="60" y1="160" x2="256" y2="160" />
        <line x1="60" y1="210" x2="256" y2="210" />
        <line x1="60" y1="260" x2="256" y2="260" />
        <line x1="60" y1="310" x2="256" y2="310" />
      </g>
    </g>

    <!-- RIGHT HALF: Checkered Flag Wing (Motorsport DNA) -->
    <g clip-path="url(#split-pad-right)">
      <rect x="256" y="110" width="210" height="300" fill="#141924" />
      <!-- High Contrast Checkered Grid on Right Wing -->
      <g transform="translate(256, 120) skewX(-16)">
        <!-- 5 rows x 4 cols -->
        <!-- Row 1 -->
        <rect x="0" y="0" width="50" height="45" fill="#FFFFFF" />
        <rect x="50" y="0" width="50" height="45" fill="#0C0E14" />
        <rect x="100" y="0" width="50" height="45" fill="#FFFFFF" />
        <rect x="150" y="0" width="50" height="45" fill="#0C0E14" />
        <!-- Row 2 -->
        <rect x="0" y="45" width="50" height="45" fill="#0C0E14" />
        <rect x="50" y="45" width="50" height="45" fill="#FFFFFF" />
        <rect x="100" y="45" width="50" height="45" fill="#0C0E14" />
        <rect x="150" y="45" width="50" height="45" fill="#FFFFFF" />
        <!-- Row 3 -->
        <rect x="0" y="90" width="50" height="45" fill="#FFFFFF" />
        <rect x="50" y="90" width="50" height="45" fill="#0C0E14" />
        <rect x="100" y="90" width="50" height="45" fill="#FFFFFF" />
        <rect x="150" y="90" width="50" height="45" fill="#0C0E14" />
        <!-- Row 4 -->
        <rect x="0" y="135" width="50" height="45" fill="#0C0E14" />
        <rect x="50" y="135" width="50" height="45" fill="#FFFFFF" />
        <rect x="100" y="135" width="50" height="45" fill="#0C0E14" />
        <rect x="150" y="135" width="50" height="45" fill="#FFFFFF" />
        <!-- Row 5 -->
        <rect x="0" y="180" width="50" height="45" fill="#FFFFFF" />
        <rect x="50" y="180" width="50" height="45" fill="#0C0E14" />
        <rect x="100" y="180" width="50" height="45" fill="#FFFFFF" />
        <rect x="150" y="180" width="50" height="45" fill="#0C0E14" />
      </g>
    </g>

    <!-- VERTICAL SPLIT RACING STRIPE IN CENTER -->
    <line x1="256" y1="120" x2="256" y2="330" stroke="#FFD133" stroke-width="6" />
    <line x1="250" y1="120" x2="250" y2="330" stroke="#33D9FF" stroke-width="2" />
    <line x1="262" y1="120" x2="262" y2="330" stroke="#EF4444" stroke-width="2" />

    <!-- LEFT CONTROLS: Cyan Glowing D-Pad -->
    <g transform="translate(145, 215)">
      <path d="M -14,-40 L 14,-40 L 14,-14 L 40,-14 L 40,14 L 14,14 L 14,40 L -14,40 L -14,14 L -40,14 L -40,-14 L -14,-14 Z" fill="#121622" stroke="#33D9FF" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.8))" />
      <polygon points="0,-32 -7,-20 7,-20" fill="#33D9FF" />
      <polygon points="0,32 -7,20 7,20" fill="#33D9FF" />
      <polygon points="-32,0 -20,-7 -20,7" fill="#33D9FF" />
      <polygon points="32,0 20,-7 20,7" fill="#33D9FF" />
      <circle cx="0" cy="0" r="7" fill="#090B10" stroke="#33D9FF" stroke-width="1.5" />
    </g>

    <!-- RIGHT CONTROLS: Beveled Gold Action Buttons -->
    <g transform="translate(365, 215)">
      <!-- 4 Buttons with heavy dark rims to pop over the checkers -->
      <circle cx="0" cy="-28" r="16" fill="#0A0D14" stroke="url(#split-gold)" stroke-width="3.5" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.9))" />
      <circle cx="0" cy="-28" r="9" fill="#FFD133" />
      
      <circle cx="28" cy="0" r="16" fill="#0A0D14" stroke="#EF4444" stroke-width="3.5" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.9))" />
      <circle cx="28" cy="0" r="9" fill="#EF4444" />
      
      <circle cx="0" cy="28" r="16" fill="#0A0D14" stroke="#33D9FF" stroke-width="3.5" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.9))" />
      <circle cx="0" cy="28" r="9" fill="#33D9FF" />
      
      <circle cx="-28" cy="0" r="16" fill="#0A0D14" stroke="#10B981" stroke-width="3.5" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.9))" />
      <circle cx="-28" cy="0" r="9" fill="#10B981" />
    </g>

    <!-- ANALOG THUMBSTICKS -->
    <g transform="translate(205, 290)">
      <circle cx="0" cy="0" r="26" fill="#0A0D14" stroke="#33D9FF" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.7))" />
      <circle cx="0" cy="0" r="18" fill="#161B26" stroke="#4A5568" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#33D9FF" />
    </g>

    <g transform="translate(305, 290)">
      <circle cx="0" cy="0" r="26" fill="#0A0D14" stroke="url(#split-gold)" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.7))" />
      <circle cx="0" cy="0" r="18" fill="#161B26" stroke="#4A5568" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#FFD133" />
    </g>


  </g>
</svg>