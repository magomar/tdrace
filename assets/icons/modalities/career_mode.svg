<svg id="emblem-career-mode" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-career" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#33FF66" flood-opacity="0.4" />
    </filter>
    <linearGradient id="trophy-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAFFEF" />
      <stop offset="35%" stop-color="#33FF66" />
      <stop offset="75%" stop-color="#00A838" />
      <stop offset="100%" stop-color="#00571C" />
    </linearGradient>
    <linearGradient id="gold-pedestal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="40%" stop-color="#FFD133" />
      <stop offset="100%" stop-color="#997000" />
    </linearGradient>
    <clipPath id="career-shield-left">
      <path d="M 256,70 L 90,105 C 50,115 45,210 50,300 C 55,395 180,445 256,460 Z" />
    </clipPath>
    <clipPath id="career-shield-right">
      <path d="M 256,70 L 422,105 C 462,115 467,210 462,300 C 457,395 332,445 256,460 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Obsidian Chassis Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#060C08" stroke="#122417" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#33FF66" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Outer Speed Shield Frame -->
  <g filter="url(#shadow-career)">
    <path d="M 256,66 L 90,102 C 46,112 40,212 46,304 C 52,400 180,450 256,466 C 332,450 460,400 466,304 C 472,212 466,112 422,102 Z" fill="#0A140D" stroke="#33FF66" stroke-width="5" />

    <!-- LEFT WING: Carbon Fiber & Championship Tier Ladder -->
    <g clip-path="url(#career-shield-left)">
      <rect x="40" y="60" width="220" height="410" fill="#07100A" />
      <!-- Carbon Weave Lines -->
      <g opacity="0.10" stroke="#FFFFFF" stroke-width="2">
        <line x1="40" y1="120" x2="260" y2="120" />
        <line x1="40" y1="160" x2="260" y2="160" />
        <line x1="40" y1="200" x2="260" y2="200" />
        <line x1="40" y1="240" x2="260" y2="240" />
        <line x1="40" y1="280" x2="260" y2="280" />
        <line x1="40" y1="320" x2="260" y2="320" />
        <line x1="40" y1="360" x2="260" y2="360" />
      </g>
      <!-- Championship Stage Steps in background -->
      <g transform="translate(60, 260)" opacity="0.4">
        <rect x="0" y="60" width="40" height="60" fill="#14301B" stroke="#33FF66" stroke-width="2" />
        <rect x="40" y="30" width="40" height="90" fill="#1B4225" stroke="#33FF66" stroke-width="2" />
        <rect x="80" y="0" width="45" height="120" fill="#255C34" stroke="#33FF66" stroke-width="2" />
      </g>
    </g>

    <!-- RIGHT WING: Skewed Checkered Flag Pattern -->
    <g clip-path="url(#career-shield-right)">
      <rect x="256" y="60" width="220" height="410" fill="#0D1A11" />
      <g transform="translate(256, 80) skewX(-16)">
        <rect x="0" y="0" width="55" height="48" fill="#FFFFFF" />
        <rect x="55" y="0" width="55" height="48" fill="#060C08" />
        <rect x="110" y="0" width="55" height="48" fill="#FFFFFF" />
        <rect x="165" y="0" width="55" height="48" fill="#060C08" />

        <rect x="0" y="48" width="55" height="48" fill="#060C08" />
        <rect x="55" y="48" width="55" height="48" fill="#FFFFFF" />
        <rect x="110" y="48" width="55" height="48" fill="#060C08" />
        <rect x="165" y="48" width="55" height="48" fill="#FFFFFF" />

        <rect x="0" y="96" width="55" height="48" fill="#FFFFFF" />
        <rect x="55" y="96" width="55" height="48" fill="#060C08" />
        <rect x="110" y="96" width="55" height="48" fill="#FFFFFF" />
        <rect x="165" y="96" width="55" height="48" fill="#060C08" />

        <rect x="0" y="144" width="55" height="48" fill="#060C08" />
        <rect x="55" y="144" width="55" height="48" fill="#FFFFFF" />
        <rect x="110" y="144" width="55" height="48" fill="#060C08" />
        <rect x="165" y="144" width="55" height="48" fill="#FFFFFF" />

        <rect x="0" y="192" width="55" height="48" fill="#FFFFFF" />
        <rect x="55" y="192" width="55" height="48" fill="#060C08" />
        <rect x="110" y="192" width="55" height="48" fill="#FFFFFF" />
        <rect x="165" y="192" width="55" height="48" fill="#060C08" />
      </g>
    </g>

    <!-- Center Spine Line -->
    <line x1="256" y1="70" x2="256" y2="455" stroke="#33FF66" stroke-width="5" />
    <line x1="248" y1="75" x2="248" y2="450" stroke="#EAFFEF" stroke-width="2" />
    <line x1="264" y1="75" x2="264" y2="450" stroke="#00A838" stroke-width="2" />

    <!-- ROMAN LAUREL WREATH (Both Sides) -->
    <!-- Left Wreath -->
    <g stroke="#33FF66" stroke-width="4" fill="#113018" stroke-linecap="round">
      <path d="M 170,360 C 120,320 110,210 160,150" fill="none" stroke-width="5" />
      <!-- Laurel Leaves -->
      <path d="M 155,335 C 130,335 125,310 148,318 Z" />
      <path d="M 140,290 C 115,280 115,255 138,268 Z" />
      <path d="M 132,240 C 110,225 118,200 138,218 Z" />
      <path d="M 138,190 C 120,170 135,145 152,170 Z" />
      <path d="M 155,150 C 145,130 168,115 178,140 Z" />
    </g>
    <!-- Right Wreath -->
    <g stroke="#33FF66" stroke-width="4" fill="#113018" stroke-linecap="round">
      <path d="M 342,360 C 392,320 402,210 352,150" fill="none" stroke-width="5" />
      <!-- Laurel Leaves -->
      <path d="M 357,335 C 382,335 387,310 364,318 Z" />
      <path d="M 372,290 C 397,280 397,255 374,268 Z" />
      <path d="M 380,240 C 402,225 394,200 374,218 Z" />
      <path d="M 374,190 C 392,170 377,145 360,170 Z" />
      <path d="M 357,150 C 367,130 344,115 334,140 Z" />
    </g>

    <!-- MONUMENTAL CHAMPIONSHIP TROPHY CUP -->
    <!-- Heavy Curved Sculptural Handles -->
    <path d="M 185,190 C 125,190 120,265 195,290" stroke="url(#trophy-green)" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M 185,190 C 135,190 130,260 195,280" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />

    <path d="M 327,190 C 387,190 392,265 317,290" stroke="url(#trophy-green)" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M 327,190 C 377,190 382,260 317,280" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Trophy Cup Main Goblet Bowl -->
    <path d="M 185,160 L 327,160 C 327,245 295,305 256,315 C 217,305 185,245 185,160 Z" fill="url(#trophy-green)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />

    <!-- Rim Lip & Fluting -->
    <ellipse cx="256" cy="160" rx="71" ry="16" fill="#EAFFEF" stroke="#FFFFFF" stroke-width="3" />
    <ellipse cx="256" cy="160" rx="55" ry="10" fill="#0C2412" />

    <!-- Embossed Victorious '#1' Medallion on Cup -->
    <circle cx="256" cy="235" r="28" fill="#12301A" stroke="url(#gold-pedestal)" stroke-width="3.5" />
    <text x="256" y="247" fill="#FFD133" font-family="sans-serif" font-weight="900" font-size="34" text-anchor="middle">1</text>

    <!-- Trophy Stem -->
    <path d="M 242,315 L 270,315 L 268,360 L 244,360 Z" fill="url(#trophy-green)" stroke="#FFFFFF" stroke-width="3" />

    <!-- Multi-Tiered Championship Pedestal Base -->
    <rect x="216" y="360" width="80" height="18" rx="4" fill="url(#gold-pedestal)" stroke="#FFFFFF" stroke-width="2.5" />
    <rect x="180" y="378" width="152" height="34" rx="6" fill="#142B1A" stroke="#33FF66" stroke-width="3.5" />

    <!-- 3 Podium Rank Stars on Base Pedestal -->
    <!-- Left Star (Silver) -->
    <polygon points="210,395 213,401 219,401 214,405 216,411 210,407 204,411 206,405 201,401 207,401" fill="#DDE4ED" stroke="#FFFFFF" stroke-width="1" />
    <!-- Center Star (Gold/Platinum) -->
    <polygon points="256,393 260,401 268,401 262,406 264,414 256,409 248,414 250,406 244,401 252,401" fill="#FFD133" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Right Star (Bronze) -->
    <polygon points="302,395 305,401 311,401 306,405 308,411 302,407 296,411 298,405 293,401 299,401" fill="#D47A33" stroke="#FFFFFF" stroke-width="1" />

    <!-- VICTORY CROWN STAR AT TOP -->
    <g transform="translate(256, 115)">
      <polygon points="0,-24 7,-8 24,-8 11,3 16,18 0,9 -16,18 -11,3 -24,-8 -7,-8" fill="#FFFFFF" filter="drop-shadow(0 0 10px #33FF66)" />
      <polygon points="0,-16 4,-6 16,-6 7,2 10,12 0,6 -10,12 -7,2 -16,-6 -4,-6" fill="#EAFFEF" />
    </g>
  </g>
</svg>
