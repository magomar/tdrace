<svg id="emblem-cloud-play" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-cloud" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#99A6BF" flood-opacity="0.35" />
    </filter>
    <linearGradient id="cloud-blade-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#C0D0E8" />
      <stop offset="75%" stop-color="#7389A8" />
      <stop offset="100%" stop-color="#344660" />
    </linearGradient>
    <linearGradient id="globe-ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B47" />
      <stop offset="100%" stop-color="#071324" />
    </linearGradient>
    <clipPath id="cloud-shield-left">
      <path d="M 256,70 L 90,105 C 50,115 45,210 50,300 C 55,395 180,445 256,460 Z" />
    </clipPath>
    <clipPath id="cloud-shield-right">
      <path d="M 256,70 L 422,105 C 462,115 467,210 462,300 C 457,395 332,445 256,460 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Obsidian Chassis Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#070910" stroke="#161E2E" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#99A6BF" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Outer Speed Shield Frame -->
  <g filter="url(#shadow-cloud)">
    <path d="M 256,66 L 90,102 C 46,112 40,212 46,304 C 52,400 180,450 256,466 C 332,450 460,400 466,304 C 472,212 466,112 422,102 Z" fill="#0E1420" stroke="#99A6BF" stroke-width="5" />

    <!-- LEFT WING: Carbon Fiber & Orbital Flight Coordinate Grid -->
    <g clip-path="url(#cloud-shield-left)">
      <rect x="40" y="60" width="220" height="410" fill="#080C14" />
      <!-- Carbon Weave Lines -->
      <g opacity="0.10" stroke="#FFFFFF" stroke-width="2">
        <line x1="40" y1="120" x2="260" y2="120" />
        <line x1="40" y1="160" x2="260" y2="160" />
        <line x1="40" y1="200" x2="260" y2="200" />
        <line x1="40" y1="240" x2="260" y2="240" />
        <line x1="40" y1="280" x2="260" y2="280" />
        <line x1="40" y1="320" x2="260" y2="320" />
        <line x1="40" y1="360" x2="260" y2="360" />
      </g>
    </g>

    <!-- RIGHT WING: Starfield & Planetary Longitude Rings -->
    <g clip-path="url(#cloud-shield-right)">
      <rect x="256" y="60" width="220" height="410" fill="#101724" />
      <!-- Coordinate Ring arcs in background -->
      <ellipse cx="256" cy="270" rx="160" ry="60" stroke="#33D9FF" stroke-width="1.5" stroke-dasharray="8 8" fill="none" opacity="0.25" />
      <!-- Data telemetry points -->
      <circle cx="340" cy="160" r="3" fill="#FFD133" />
      <circle cx="410" cy="230" r="2.5" fill="#33D9FF" />
      <circle cx="380" cy="340" r="3" fill="#33FF66" />
    </g>

    <!-- Center Line -->
    <line x1="256" y1="70" x2="256" y2="455" stroke="#99A6BF" stroke-width="5" />
    <line x1="248" y1="75" x2="248" y2="450" stroke="#FFFFFF" stroke-width="2" />
    <line x1="264" y1="75" x2="264" y2="450" stroke="#5E708A" stroke-width="2" />

    <!-- 3D GLOBE WITH CONTINENTAL NODES (Center) -->
    <g transform="translate(256, 270)">
      <!-- Ocean Sphere -->
      <circle cx="0" cy="0" r="115" fill="url(#globe-ocean)" stroke="url(#cloud-blade-grad)" stroke-width="6" filter="drop-shadow(0 10px 24px rgba(0,0,0,0.9))" />
      <!-- Longitude & Latitude Wireframe Rings -->
      <ellipse cx="0" cy="0" rx="115" ry="40" stroke="#33D9FF" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.4" />
      <ellipse cx="0" cy="0" rx="45" ry="115" stroke="#33D9FF" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.4" />
      <line x1="-115" y1="0" x2="115" y2="0" stroke="#33D9FF" stroke-width="2" opacity="0.4" />
      <line x1="0" y1="-115" x2="0" y2="115" stroke="#33D9FF" stroke-width="2" opacity="0.4" />

      <!-- Stylized Cyber Continents & Network Vertices -->
      <!-- Americas -->
      <path d="M -70,-60 L -40,-65 L -35,-20 L -60,0 L -40,30 L -50,70 L -65,30 Z" fill="#204060" stroke="#33D9FF" stroke-width="2" opacity="0.8" />
      <circle cx="-50" cy="-40" r="4" fill="#33FF66" filter="drop-shadow(0 0 4px #33FF66)" />
      <circle cx="-55" cy="45" r="4" fill="#FFD133" filter="drop-shadow(0 0 4px #FFD133)" />

      <!-- Eurasia / Africa -->
      <path d="M 0,-70 L 60,-65 L 80,-20 L 50,-10 L 40,40 L 15,40 L 10,-20 Z" fill="#204060" stroke="#33D9FF" stroke-width="2" opacity="0.8" />
      <circle cx="35" cy="-45" r="4" fill="#33D9FF" filter="drop-shadow(0 0 4px #33D9FF)" />
      <circle cx="30" cy="20" r="4" fill="#33FF66" filter="drop-shadow(0 0 4px #33FF66)" />

      <!-- Intercontinental Data Beam Line -->
      <line x1="-50" y1="-40" x2="35" y2="-45" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" filter="drop-shadow(0 0 6px #FFFFFF)" />
    </g>

    <!-- GEOMETRIC CLOUD SERVER INFRASTRUCTURE EMBLEM (Overlaying Globe Top) -->
    <g transform="translate(256, 175)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.85))">
      <!-- Sculpted Cloud Contour Base -->
      <path d="M -80,30 C -110,30 -125,5 -125,-20 C -125,-48 -100,-65 -75,-65 C -70,-95 -40,-115 0,-115 C 45,-115 75,-90 80,-60 C 105,-60 125,-40 125,-15 C 125,12 105,30 75,30 Z" fill="#131C2C" stroke="url(#cloud-blade-grad)" stroke-width="6" stroke-linejoin="round" />
      <path d="M -70,20 C -95,20 -110,0 -110,-18 C -110,-38 -90,-52 -68,-52 C -62,-80 -35,-98 0,-98 C 38,-98 62,-78 68,-50 C 88,-50 108,-32 108,-12 C 108,10 90,20 68,20 Z" fill="#0C121D" stroke="#33D9FF" stroke-width="2" />

      <!-- Server Rack Grid Slots inside Cloud -->
      <rect x="-45" y="-55" width="90" height="12" rx="3" fill="#1E2A3F" stroke="#7A93B8" stroke-width="1.5" />
      <circle cx="-30" cy="-49" r="2.5" fill="#33FF66" />
      <circle cx="-18" cy="-49" r="2.5" fill="#33D9FF" />

      <rect x="-45" y="-35" width="90" height="12" rx="3" fill="#1E2A3F" stroke="#7A93B8" stroke-width="1.5" />
      <circle cx="-30" cy="-29" r="2.5" fill="#33FF66" />
      <circle cx="-18" cy="-29" r="2.5" fill="#FFD133" />

      <rect x="-45" y="-15" width="90" height="12" rx="3" fill="#1E2A3F" stroke="#7A93B8" stroke-width="1.5" />
      <circle cx="-30" cy="-9" r="2.5" fill="#33D9FF" />
      <circle cx="-18" cy="-9" r="2.5" fill="#33D9FF" />
    </g>

    <!-- ORBITAL HIGH-SPEED TELEMETRY RACING RING -->
    <g transform="translate(256, 270) rotate(-22)">
      <ellipse cx="0" cy="0" rx="165" ry="48" stroke="#33D9FF" stroke-width="6" stroke-dasharray="16 10" fill="none" filter="drop-shadow(0 0 10px #33D9FF)" />
      <!-- Orbital Telemetry Satellite Node -->
      <g transform="translate(165, 0)">
        <circle cx="0" cy="0" r="12" fill="#FFFFFF" filter="drop-shadow(0 0 8px #FFD133)" />
        <rect x="-24" y="-4" width="12" height="8" rx="2" fill="#FFD133" />
        <rect x="12" y="-4" width="12" height="8" rx="2" fill="#FFD133" />
      </g>
    </g>
  </g>
</svg>
