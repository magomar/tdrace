<svg id="emblem-free-ride" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-free" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#59BFFF" flood-opacity="0.4" />
    </filter>
    <linearGradient id="horizon-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#99DFFF" />
      <stop offset="100%" stop-color="#2699FB" />
    </linearGradient>
    <linearGradient id="asphalt-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2D42" />
      <stop offset="100%" stop-color="#0B131C" />
    </linearGradient>
    <clipPath id="free-shield-left">
      <path d="M 256,70 L 90,105 C 50,115 45,210 50,300 C 55,395 180,445 256,460 Z" />
    </clipPath>
    <clipPath id="free-shield-right">
      <path d="M 256,70 L 422,105 C 462,115 467,210 462,300 C 457,395 332,445 256,460 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Obsidian Chassis Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#060C14" stroke="#101F33" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#59BFFF" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Outer Speed Shield Frame -->
  <g filter="url(#shadow-free)">
    <path d="M 256,66 L 90,102 C 46,112 40,212 46,304 C 52,400 180,450 256,466 C 332,450 460,400 466,304 C 472,212 466,112 422,102 Z" fill="#0B1524" stroke="#59BFFF" stroke-width="5" />

    <!-- LEFT WING: Carbon & Coastal Mountain Contours -->
    <g clip-path="url(#free-shield-left)">
      <rect x="40" y="60" width="220" height="410" fill="#08101A" />
      <g opacity="0.10" stroke="#FFFFFF" stroke-width="2">
        <line x1="40" y1="120" x2="260" y2="120" />
        <line x1="40" y1="160" x2="260" y2="160" />
        <line x1="40" y1="200" x2="260" y2="200" />
        <line x1="40" y1="240" x2="260" y2="240" />
        <line x1="40" y1="280" x2="260" y2="280" />
        <line x1="40" y1="320" x2="260" y2="320" />
        <line x1="40" y1="360" x2="260" y2="360" />
      </g>
      <!-- Mountain Layer Left -->
      <polygon points="40,260 140,180 256,260" fill="#132338" opacity="0.8" />
    </g>

    <!-- RIGHT WING: Radiant Sunburst Rays -->
    <g clip-path="url(#free-shield-right)">
      <rect x="256" y="60" width="220" height="410" fill="#0F1B2B" />
      <!-- Radial Dawn Rays -->
      <g stroke="#59BFFF" stroke-width="3" opacity="0.35">
        <line x1="256" y1="220" x2="360" y2="90" />
        <line x1="256" y1="220" x2="420" y2="140" />
        <line x1="256" y1="220" x2="450" y2="200" />
        <line x1="256" y1="220" x2="440" y2="270" />
        <line x1="256" y1="220" x2="400" y2="330" />
      </g>
      <!-- Mountain Layer Right -->
      <polygon points="256,260 380,170 470,260" fill="#15273E" opacity="0.8" />
    </g>

    <!-- Center Line -->
    <line x1="256" y1="70" x2="256" y2="455" stroke="#59BFFF" stroke-width="5" />
    <line x1="248" y1="75" x2="248" y2="450" stroke="#FFFFFF" stroke-width="2" />
    <line x1="264" y1="75" x2="264" y2="450" stroke="#1C7CCC" stroke-width="2" />

    <!-- RISING DAWN HORIZON SUN & SKYLINE -->
    <g transform="translate(256, 220)">
      <!-- Sun Glow Aura -->
      <circle cx="0" cy="0" r="64" fill="url(#horizon-sun)" filter="drop-shadow(0 0 16px #59BFFF)" />
      <!-- Horizontal Horizon Glare Slits -->
      <line x1="-160" y1="0" x2="160" y2="0" stroke="#FFFFFF" stroke-width="4" />
      <line x1="-120" y1="8" x2="120" y2="8" stroke="#59BFFF" stroke-width="2" />
    </g>

    <!-- ENDLESS PERSPECTIVE HIGHWAY SERPENTINE RIBBON -->
    <g>
      <!-- Road Surface Sinuous Curve -->
      <path d="M 256,220 Q 230,280 310,330 Q 360,370 340,445 L 172,445 Q 190,370 210,330 Q 240,280 256,220 Z" fill="url(#asphalt-ribbon)" stroke="#59BFFF" stroke-width="4" stroke-linejoin="round" />

      <!-- Red & White FIA Apex Curbs on Left Swerve -->
      <path d="M 190,370 Q 210,330 240,280" stroke="#EF4444" stroke-width="8" fill="none" stroke-dasharray="14 14" />
      <!-- Red & White FIA Apex Curbs on Right Swerve -->
      <path d="M 310,330 Q 360,370 340,445" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-dasharray="14 14" />

      <!-- Reflective Dashed Center Passing Line -->
      <path d="M 256,225 Q 236,280 300,330 Q 345,370 326,445" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 18" fill="none" filter="drop-shadow(0 0 4px #FFFFFF)" />
    </g>

    <!-- SPORTS ROADSTER CRUISING INTO THE HORIZON (Silhouette) -->
    <g transform="translate(256, 320) scale(0.75)" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.9))">
      <!-- Car Rear Profile Body -->
      <path d="M -48,40 C -48,25 -36,15 -18,15 L 18,15 C 36,15 48,25 48,40 L 44,52 C 42,56 36,58 24,58 L -24,58 C -36,58 -42,56 -44,52 Z" fill="#59BFFF" stroke="#FFFFFF" stroke-width="3" />
      <!-- Cockpit & Driver Helmet in Center -->
      <path d="M -24,15 L -16,-6 L 16,-6 L 24,15 Z" fill="#080F17" stroke="#59BFFF" stroke-width="2" />
      <circle cx="0" cy="4" r="8" fill="#FFFFFF" />
      <!-- Glowing Red Cyber Tail Lights -->
      <rect x="-42" y="32" width="20" height="8" rx="3" fill="#EF4444" filter="drop-shadow(0 0 6px #EF4444)" />
      <rect x="22" y="32" width="20" height="8" rx="3" fill="#EF4444" filter="drop-shadow(0 0 6px #EF4444)" />
      <!-- Dual Exhaust Pipes -->
      <circle cx="-16" cy="52" r="5" fill="#FFFFFF" />
      <circle cx="16" cy="52" r="5" fill="#FFFFFF" />
      <!-- Wide Rear Wheels -->
      <rect x="-56" y="32" width="12" height="26" rx="4" fill="#04080D" stroke="#59BFFF" stroke-width="1.5" />
      <rect x="44" y="32" width="12" height="26" rx="4" fill="#04080D" stroke="#59BFFF" stroke-width="1.5" />
    </g>
  </g>
</svg>
