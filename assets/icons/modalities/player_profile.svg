<svg id="emblem-player-profile" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-profile" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#33D9FF" flood-opacity="0.4" />
    </filter>
    <linearGradient id="helmet-composite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#A5EDFF" />
      <stop offset="70%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#004766" />
    </linearGradient>
    <linearGradient id="iridium-visor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF33CC" />
      <stop offset="35%" stop-color="#FF801A" />
      <stop offset="70%" stop-color="#FFD133" />
      <stop offset="100%" stop-color="#33D9FF" />
    </linearGradient>
    <clipPath id="profile-shield-left">
      <path d="M 256,70 L 90,105 C 50,115 45,210 50,300 C 55,395 180,445 256,460 Z" />
    </clipPath>
    <clipPath id="profile-shield-right">
      <path d="M 256,70 L 422,105 C 462,115 467,210 462,300 C 457,395 332,445 256,460 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Obsidian Chassis Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#070A10" stroke="#162233" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#33D9FF" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Outer Speed Shield Frame -->
  <g filter="url(#shadow-profile)">
    <path d="M 256,66 L 90,102 C 46,112 40,212 46,304 C 52,400 180,450 256,466 C 332,450 460,400 466,304 C 472,212 466,112 422,102 Z" fill="#0D1624" stroke="#33D9FF" stroke-width="5" />

    <!-- LEFT WING: Carbon Fiber & Telemetry Reaction Waveform -->
    <g clip-path="url(#profile-shield-left)">
      <rect x="40" y="60" width="220" height="410" fill="#090E17" />
      <!-- Carbon Weave Lines -->
      <g opacity="0.10" stroke="#FFFFFF" stroke-width="2">
        <line x1="40" y1="120" x2="260" y2="120" />
        <line x1="40" y1="160" x2="260" y2="160" />
        <line x1="40" y1="200" x2="260" y2="200" />
        <line x1="40" y1="240" x2="260" y2="240" />
        <line x1="40" y1="280" x2="260" y2="280" />
        <line x1="40" y1="320" x2="260" y2="320" />
        <line x1="40" y1="360" x2="260" y2="360" />
      </g>
      <!-- Biometric Waveform -->
      <path d="M 50,220 L 100,220 L 115,180 L 130,250 L 145,210 L 160,225 L 200,225" stroke="#33D9FF" stroke-width="3" fill="none" opacity="0.4" />
    </g>

    <!-- RIGHT WING: Driver License Blueprint & Checkered Accents -->
    <g clip-path="url(#profile-shield-right)">
      <rect x="256" y="60" width="220" height="410" fill="#101B2B" />
      <g transform="translate(256, 80) skewX(-16)" opacity="0.3">
        <rect x="0" y="0" width="55" height="48" fill="#FFFFFF" />
        <rect x="55" y="0" width="55" height="48" fill="#070A10" />
        <rect x="110" y="0" width="55" height="48" fill="#FFFFFF" />
        <rect x="165" y="0" width="55" height="48" fill="#070A10" />

        <rect x="0" y="48" width="55" height="48" fill="#070A10" />
        <rect x="55" y="48" width="55" height="48" fill="#FFFFFF" />
        <rect x="110" y="48" width="55" height="48" fill="#070A10" />
        <rect x="165" y="48" width="55" height="48" fill="#FFFFFF" />

        <rect x="0" y="96" width="55" height="48" fill="#FFFFFF" />
        <rect x="55" y="96" width="55" height="48" fill="#070A10" />
        <rect x="110" y="96" width="55" height="48" fill="#FFFFFF" />
        <rect x="165" y="96" width="55" height="48" fill="#070A10" />
      </g>
    </g>

    <!-- Center Line -->
    <line x1="256" y1="70" x2="256" y2="455" stroke="#33D9FF" stroke-width="5" />
    <line x1="248" y1="75" x2="248" y2="450" stroke="#FFFFFF" stroke-width="2" />
    <line x1="264" y1="75" x2="264" y2="450" stroke="#0080B3" stroke-width="2" />

    <!-- ULTRA-DETAILED PRO MOTORSPORT FULL-FACE HELMET (3/4 Profile) -->
    <g transform="translate(256, 245)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.9))">
      <!-- Helmet Outer Composite Shell -->
      <path d="M -110,75 C -130,35 -130,-45 -80,-95 C -30,-145 75,-140 115,-90 C 145,-50 145,15 130,55 C 115,90 85,105 45,112 C 0,120 -80,115 -110,75 Z" fill="url(#helmet-composite)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />

      <!-- Top Aerodynamic Air Scoop Fins -->
      <path d="M -40,-125 L 20,-125 L 35,-105 L -25,-105 Z" fill="#0D1E30" stroke="#33D9FF" stroke-width="2.5" />
      <path d="M 40,-115 L 85,-100 L 80,-85 L 35,-100 Z" fill="#0D1E30" stroke="#33D9FF" stroke-width="2.5" />

      <!-- Chin Aerodynamic Gurney Flap & Lower Trim -->
      <path d="M -100,75 C -70,95 20,95 45,90 L 40,112 C 0,118 -75,112 -100,85 Z" fill="#09131F" stroke="#33D9FF" stroke-width="2" />

      <!-- Carbon Crown Panel Texture -->
      <path d="M -70,-80 C -30,-115 50,-110 80,-75 L 60,-50 C 35,-75 -25,-75 -55,-55 Z" fill="#091422" stroke="#33D9FF" stroke-width="1.5" />

      <!-- Aggressive Chin Vent Mesh -->
      <g transform="translate(-50, 60)">
        <polygon points="0,0 45,0 40,18 -5,18" fill="#0A111A" stroke="#FFFFFF" stroke-width="1.5" />
        <line x1="8" y1="4" x2="8" y2="14" stroke="#33D9FF" stroke-width="2" />
        <line x1="18" y1="4" x2="18" y2="14" stroke="#33D9FF" stroke-width="2" />
        <line x1="28" y1="4" x2="28" y2="14" stroke="#33D9FF" stroke-width="2" />
      </g>

      <!-- IRIDIUM REFLECTIVE VISOR WITH TEAR-OFF POSTS -->
      <!-- Visor Aperture Frame -->
      <path d="M -30,-45 L 115,-35 C 130,-10 130,25 110,48 L 10,40 C -15,40 -30,5 -30,-45 Z" fill="#080C14" stroke="#122538" stroke-width="6" />
      <!-- Iridium Visor Blade -->
      <path d="M -26,-40 L 110,-30 C 122,-8 122,22 104,42 L 14,35 C -10,35 -26,5 -26,-40 Z" fill="url(#iridium-visor)" stroke="#FFFFFF" stroke-width="2.5" />

      <!-- Visor Glare & Reflection Streak -->
      <path d="M -5,-35 L 85,-25 C 92,-10 92,10 80,24 L 20,18 Z" fill="#FFFFFF" opacity="0.35" />

      <!-- Visor Pivot Screw (Gold Knurled) -->
      <circle cx="-30" cy="-5" r="14" fill="#0D1E30" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="-30" cy="-5" r="7" fill="#FFD133" />
      <!-- Visor Tear-Off Post -->
      <circle cx="95" cy="5" r="5" fill="#FFFFFF" stroke="#0D1E30" stroke-width="2" />
    </g>

    <!-- FIA SUPER-LICENSE STAR RANKING CREST (Lower Base) -->
    <g transform="translate(256, 400)">
      <rect x="-105" y="-18" width="210" height="36" rx="8" fill="#08101A" stroke="#33D9FF" stroke-width="3" />
      <!-- 5 Gold Stars -->
      <polygon points="-80,-4 -76,4 -68,4 -74,9 -72,17 -80,12 -88,17 -86,9 -92,4 -84,4" fill="#FFD133" stroke="#FFFFFF" stroke-width="1" />
      <polygon points="-40,-4 -36,4 -28,4 -34,9 -32,17 -40,12 -48,17 -46,9 -52,4 -44,4" fill="#FFD133" stroke="#FFFFFF" stroke-width="1" />
      <polygon points="0,-7 5,3 15,3 7,9 10,19 0,13 -10,19 -7,9 -15,3 -5,3" fill="#FFD133" stroke="#FFFFFF" stroke-width="1.5" filter="drop-shadow(0 0 6px #FFD133)" />
      <polygon points="40,-4 44,4 52,4 46,9 48,17 40,12 32,17 34,9 28,4 36,4" fill="#FFD133" stroke="#FFFFFF" stroke-width="1" />
      <polygon points="80,-4 84,4 92,4 86,9 88,17 80,12 72,17 74,9 68,4 76,4" fill="#FFD133" stroke="#FFFFFF" stroke-width="1" />
    </g>
  </g>
</svg>
