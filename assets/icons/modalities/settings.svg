<svg id="emblem-settings" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-settings" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#FF33CC" flood-opacity="0.4" />
    </filter>
    <linearGradient id="gear-magenta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0FA" />
      <stop offset="35%" stop-color="#FF33CC" />
      <stop offset="75%" stop-color="#A80080" />
      <stop offset="100%" stop-color="#5C0046" />
    </linearGradient>
    <linearGradient id="slider-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF33CC" />
      <stop offset="100%" stop-color="#6B0052" />
    </linearGradient>
    <clipPath id="settings-shield-left">
      <path d="M 256,70 L 90,105 C 50,115 45,210 50,300 C 55,395 180,445 256,460 Z" />
    </clipPath>
    <clipPath id="settings-shield-right">
      <path d="M 256,70 L 422,105 C 462,115 467,210 462,300 C 457,395 332,445 256,460 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Obsidian Chassis Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#0C060B" stroke="#261021" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#FF33CC" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Outer Speed Shield Frame -->
  <g filter="url(#shadow-settings)">
    <path d="M 256,66 L 90,102 C 46,112 40,212 46,304 C 52,400 180,450 256,466 C 332,450 460,400 466,304 C 472,212 466,112 422,102 Z" fill="#140912" stroke="#FF33CC" stroke-width="5" />

    <!-- LEFT WING: Carbon Fiber & Equalizer Mixer Console -->
    <g clip-path="url(#settings-shield-left)">
      <rect x="40" y="60" width="220" height="410" fill="#0E050D" />
      <!-- Carbon Weave Lines -->
      <g opacity="0.10" stroke="#FFFFFF" stroke-width="2">
        <line x1="40" y1="120" x2="260" y2="120" />
        <line x1="40" y1="160" x2="260" y2="160" />
        <line x1="40" y1="200" x2="260" y2="200" />
        <line x1="40" y1="240" x2="260" y2="240" />
        <line x1="40" y1="280" x2="260" y2="280" />
        <line x1="40" y1="320" x2="260" y2="320" />
        <line x1="40" y1="360" x2="260" y2="360" />
      </g>

      <!-- 3 Vertical Equalizer Fader Slots in background -->
      <g transform="translate(60, 160)">
        <!-- Channel 1 -->
        <rect x="16" y="0" width="8" height="150" rx="4" fill="#240A20" />
        <rect x="16" y="60" width="8" height="90" rx="4" fill="url(#slider-glow)" />
        <rect x="6" y="50" width="28" height="16" rx="4" fill="#FFE6F8" stroke="#FF33CC" stroke-width="2" />

        <!-- Channel 2 -->
        <rect x="56" y="0" width="8" height="150" rx="4" fill="#240A20" />
        <rect x="56" y="30" width="8" height="120" rx="4" fill="url(#slider-glow)" />
        <rect x="46" y="20" width="28" height="16" rx="4" fill="#FFE6F8" stroke="#FF33CC" stroke-width="2" />

        <!-- Channel 3 -->
        <rect x="96" y="0" width="8" height="150" rx="4" fill="#240A20" />
        <rect x="96" y="90" width="8" height="60" rx="4" fill="url(#slider-glow)" />
        <rect x="86" y="80" width="28" height="16" rx="4" fill="#FFE6F8" stroke="#FF33CC" stroke-width="2" />
      </g>
    </g>

    <!-- RIGHT WING: Mechanical Transmission Gear Mesh Grid -->
    <g clip-path="url(#settings-shield-right)">
      <rect x="256" y="60" width="220" height="410" fill="#170A15" />
      <!-- Secondary Driven Pinion Gear in background -->
      <g transform="translate(370, 180)" opacity="0.35">
        <circle cx="0" cy="0" r="75" stroke="#FF33CC" stroke-width="16" stroke-dasharray="20 14" fill="none" />
        <circle cx="0" cy="0" r="50" stroke="#FF33CC" stroke-width="5" fill="#140612" />
        <circle cx="0" cy="0" r="20" fill="#0C030A" stroke="#FF33CC" stroke-width="3" />
      </g>
    </g>

    <!-- Center Line -->
    <line x1="256" y1="70" x2="256" y2="455" stroke="#FF33CC" stroke-width="5" />
    <line x1="248" y1="75" x2="248" y2="450" stroke="#FFFFFF" stroke-width="2" />
    <line x1="264" y1="75" x2="264" y2="450" stroke="#8A0066" stroke-width="2" />

    <!-- PRIMARY PRECISION 10-TOOTH TRANSMISSION GEAR (Central) -->
    <g transform="translate(290, 275)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.9))">
      <!-- 10 Beveled Gear Teeth (Radial Array) -->
      <!-- 0 deg -->
      <path d="M -22,-135 L 22,-135 L 26,-105 L -26,-105 Z" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="2" />
      <!-- 36 deg -->
      <g transform="rotate(36)">
        <path d="M -22,-135 L 22,-135 L 26,-105 L -26,-105 Z" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="2" />
      </g>
      <!-- 72 deg -->
      <g transform="rotate(72)">
        <path d="M -22,-135 L 22,-135 L 26,-105 L -26,-105 Z" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="2" />
      </g>
      <!-- 108 deg -->
      <g transform="rotate(108)">
        <path d="M -22,-135 L 22,-135 L 26,-105 L -26,-105 Z" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="2" />
      </g>
      <!-- 144 deg -->
      <g transform="rotate(144)">
        <path d="M -22,-135 L 22,-135 L 26,-105 L -26,-105 Z" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="2" />
      </g>
      <!-- 180 deg -->
      <g transform="rotate(180)">
        <path d="M -22,-135 L 22,-135 L 26,-105 L -26,-105 Z" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="2" />
      </g>
      <!-- 216 deg -->
      <g transform="rotate(216)">
        <path d="M -22,-135 L 22,-135 L 26,-105 L -26,-105 Z" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="2" />
      </g>
      <!-- 252 deg -->
      <g transform="rotate(252)">
        <path d="M -22,-135 L 22,-135 L 26,-105 L -26,-105 Z" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="2" />
      </g>
      <!-- 288 deg -->
      <g transform="rotate(288)">
        <path d="M -22,-135 L 22,-135 L 26,-105 L -26,-105 Z" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="2" />
      </g>
      <!-- 324 deg -->
      <g transform="rotate(324)">
        <path d="M -22,-135 L 22,-135 L 26,-105 L -26,-105 Z" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="2" />
      </g>

      <!-- Main Outer Gear Rim Body -->
      <circle cx="0" cy="0" r="115" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="4" />
      <circle cx="0" cy="0" r="88" fill="#1C091A" stroke="#5E004B" stroke-width="4" />

      <!-- 5 Sculpted Spoke Cutouts -->
      <g fill="#0C030A" stroke="#FF33CC" stroke-width="2.5">
        <circle cx="0" cy="-55" r="16" />
        <circle cx="52" cy="-17" r="16" />
        <circle cx="32" cy="45" r="16" />
        <circle cx="-32" cy="45" r="16" />
        <circle cx="-52" cy="-17" r="16" />
      </g>

      <!-- Central Axle Hub & Ball Bearing Core -->
      <circle cx="0" cy="0" r="28" fill="url(#gear-magenta-grad)" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="0" cy="0" r="14" fill="#0C030A" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>

    <!-- LED VU PEAK METERS AT LOWER LEFT -->
    <g transform="translate(130, 360)">
      <rect x="0" y="0" width="12" height="6" rx="1.5" fill="#33FF66" />
      <rect x="16" y="0" width="12" height="6" rx="1.5" fill="#33FF66" />
      <rect x="32" y="0" width="12" height="6" rx="1.5" fill="#33FF66" />
      <rect x="48" y="0" width="12" height="6" rx="1.5" fill="#FFD133" />
      <rect x="64" y="0" width="12" height="6" rx="1.5" fill="#FF801A" />
      <rect x="80" y="0" width="12" height="6" rx="1.5" fill="#EF4444" filter="drop-shadow(0 0 4px #EF4444)" />
    </g>
  </g>
</svg>
