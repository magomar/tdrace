<svg id="emblem-custom-race" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-custom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#FFD133" flood-opacity="0.4" />
    </filter>
    <linearGradient id="custom-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="35%" stop-color="#FFD133" />
      <stop offset="80%" stop-color="#C69200" />
      <stop offset="100%" stop-color="#735200" />
    </linearGradient>
    <linearGradient id="titanium-wrench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#DDE4ED" />
      <stop offset="70%" stop-color="#7B8A9E" />
      <stop offset="100%" stop-color="#3A4657" />
    </linearGradient>
    <clipPath id="custom-shield-left">
      <path d="M 256,70 L 90,105 C 50,115 45,210 50,300 C 55,395 180,445 256,460 Z" />
    </clipPath>
    <clipPath id="custom-shield-right">
      <path d="M 256,70 L 422,105 C 462,115 467,210 462,300 C 457,395 332,445 256,460 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Obsidian Chassis Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#0A0906" stroke="#261E0E" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#FFD133" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Outer Speed Shield Frame -->
  <g filter="url(#shadow-custom)">
    <path d="M 256,66 L 90,102 C 46,112 40,212 46,304 C 52,400 180,450 256,466 C 332,450 460,400 466,304 C 472,212 466,112 422,102 Z" fill="#141108" stroke="#FFD133" stroke-width="5" />

    <!-- LEFT WING: Carbon Fiber & Dyno Tuning Sliders -->
    <g clip-path="url(#custom-shield-left)">
      <rect x="40" y="60" width="220" height="410" fill="#0C0A06" />
      <!-- Carbon Weave Lines -->
      <g opacity="0.10" stroke="#FFFFFF" stroke-width="2">
        <line x1="40" y1="120" x2="260" y2="120" />
        <line x1="40" y1="160" x2="260" y2="160" />
        <line x1="40" y1="200" x2="260" y2="200" />
        <line x1="40" y1="240" x2="260" y2="240" />
        <line x1="40" y1="280" x2="260" y2="280" />
        <line x1="40" y1="320" x2="260" y2="320" />
        <line x1="40" y1="360" x2="260" y2="360" />
      </g>

      <!-- Dyno Calibration Sliders in background -->
      <g transform="translate(65, 150)">
        <!-- Track 1 -->
        <line x1="20" y1="20" x2="160" y2="20" stroke="#3D3012" stroke-width="8" stroke-linecap="round" />
        <line x1="20" y1="20" x2="110" y2="20" stroke="#FFD133" stroke-width="8" stroke-linecap="round" />
        <circle cx="110" cy="20" r="12" fill="#FFF5B8" stroke="#B8860B" stroke-width="3" />
        <!-- Track 2 -->
        <line x1="20" y1="60" x2="160" y2="60" stroke="#3D3012" stroke-width="8" stroke-linecap="round" />
        <line x1="20" y1="60" x2="70" y2="60" stroke="#FFD133" stroke-width="8" stroke-linecap="round" />
        <circle cx="70" cy="60" r="12" fill="#FFF5B8" stroke="#B8860B" stroke-width="3" />
        <!-- Track 3 -->
        <line x1="20" y1="100" x2="160" y2="100" stroke="#3D3012" stroke-width="8" stroke-linecap="round" />
        <line x1="20" y1="100" x2="135" y2="100" stroke="#FFD133" stroke-width="8" stroke-linecap="round" />
        <circle cx="135" cy="100" r="12" fill="#FFF5B8" stroke="#B8860B" stroke-width="3" />
      </g>
    </g>

    <!-- RIGHT WING: Precision Mechanical Crown Gearwheel -->
    <g clip-path="url(#custom-shield-right)">
      <rect x="256" y="60" width="220" height="410" fill="#141006" />
      <!-- Giant Precision Cogwheel -->
      <g transform="translate(350, 240)" opacity="0.35">
        <circle cx="0" cy="0" r="110" stroke="#FFD133" stroke-width="18" stroke-dasharray="24 16" fill="none" />
        <circle cx="0" cy="0" r="75" stroke="#FFD133" stroke-width="6" fill="#1E1708" />
        <circle cx="0" cy="0" r="30" fill="#0C0A06" stroke="#FFD133" stroke-width="4" />
        <!-- 6 Spokes -->
        <line x1="-75" y1="0" x2="75" y2="0" stroke="#FFD133" stroke-width="6" />
        <line x1="-37" y1="-65" x2="37" y2="65" stroke="#FFD133" stroke-width="6" />
        <line x1="-37" y1="65" x2="37" y2="-65" stroke="#FFD133" stroke-width="6" />
      </g>
    </g>

    <!-- Center Pinstripe Dividers -->
    <line x1="256" y1="70" x2="256" y2="455" stroke="#FFD133" stroke-width="5" />
    <line x1="248" y1="75" x2="248" y2="450" stroke="#FFF8D6" stroke-width="2" />
    <line x1="264" y1="75" x2="264" y2="450" stroke="#C69200" stroke-width="2" />

    <!-- CROSSED MOTORSPORT TOOLS: Forged Titanium Wrench & Vernier Caliper -->
    <!-- 1. Forged Racing Wrench (Angled 45 deg) -->
    <g transform="translate(256, 260) rotate(-45)">
      <!-- Wrench Handle -->
      <rect x="-24" y="-140" width="48" height="280" rx="14" fill="url(#titanium-wrench)" stroke="#FFFFFF" stroke-width="3" />
      <rect x="-10" y="-100" width="20" height="200" rx="8" fill="#1E242E" stroke="#526075" stroke-width="2" />

      <!-- Top Open Wrench Jaw Head -->
      <g transform="translate(0, -140)">
        <circle cx="0" cy="0" r="48" fill="url(#titanium-wrench)" stroke="#FFFFFF" stroke-width="3" />
        <polygon points="-20,-50 20,-50 24,-6 -24,-6" fill="#141108" />
      </g>

      <!-- Bottom Ring Box Head -->
      <g transform="translate(0, 140)">
        <circle cx="0" cy="0" r="46" fill="url(#titanium-wrench)" stroke="#FFFFFF" stroke-width="3" />
        <circle cx="0" cy="0" r="24" fill="#141108" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="10 4" />
      </g>
    </g>

    <!-- 2. Beveled Gold Digital Vernier Caliper (Angled 45 deg, Foreground) -->
    <g transform="translate(256, 260) rotate(45)" filter="drop-shadow(0 12px 18px rgba(0,0,0,0.9))">
      <!-- Main Caliper Beam Scale -->
      <rect x="-14" y="-160" width="28" height="320" rx="6" fill="url(#custom-gold)" stroke="#FFFFFF" stroke-width="3" />
      <!-- Millimeter Hash Marks -->
      <g stroke="#523900" stroke-width="2" opacity="0.8">
        <line x1="-12" y1="-120" x2="-2" y2="-120" />
        <line x1="-12" y1="-100" x2="-2" y2="-100" />
        <line x1="-12" y1="-80" x2="-2" y2="-80" />
        <line x1="-12" y1="-60" x2="-2" y2="-60" />
        <line x1="-12" y1="-40" x2="-2" y2="-40" />
        <line x1="-12" y1="-20" x2="-2" y2="-20" />
        <line x1="-12" y1="0" x2="-2" y2="0" />
        <line x1="-12" y1="20" x2="-2" y2="20" />
        <line x1="-12" y1="40" x2="-2" y2="40" />
        <line x1="-12" y1="60" x2="-2" y2="60" />
        <line x1="-12" y1="80" x2="-2" y2="80" />
        <line x1="-12" y1="100" x2="-2" y2="100" />
        <line x1="-12" y1="120" x2="-2" y2="120" />
      </g>

      <!-- Fixed Upper External Measuring Jaw -->
      <path d="M -14,-160 L -75,-160 L -80,-115 L -14,-130 Z" fill="url(#custom-gold)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
      <!-- Fixed Upper Internal Measuring Horn -->
      <path d="M 14,-160 L 50,-160 L 45,-125 L 14,-135 Z" fill="url(#custom-gold)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Sliding Digital Vernier Head (Center) -->
      <g transform="translate(0, -30)">
        <rect x="-24" y="-30" width="48" height="60" rx="8" fill="#1C1506" stroke="url(#custom-gold)" stroke-width="3.5" />
        <!-- Digital Display / Caliper Window -->
        <rect x="-16" y="-18" width="32" height="24" rx="4" fill="#0C0A04" stroke="#FFD133" stroke-width="1.5" />
        <text x="-12" y="-1" fill="#FFD133" font-family="monospace" font-weight="bold" font-size="12">99.8</text>
        <!-- Sliding External Jaw -->
        <path d="M -24,-20 L -75,-30 L -80,15 L -24,5 Z" fill="url(#custom-gold)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
        <!-- Knurled Thumb Wheel -->
        <circle cx="24" cy="5" r="10" fill="#B8860B" stroke="#FFFFFF" stroke-width="2" />
      </g>
    </g>

    <!-- Central Interlocking Center Pivot Jewel -->
    <circle cx="256" cy="260" r="20" fill="#0A0906" stroke="#FFD133" stroke-width="4" filter="drop-shadow(0 0 10px #FFD133)" />
    <circle cx="256" cy="260" r="10" fill="#FFF5B8" />
  </g>
</svg>
