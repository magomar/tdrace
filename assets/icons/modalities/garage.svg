<svg id="emblem-garage" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-garage" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#FFD133" flood-opacity="0.4" />
    </filter>
    <linearGradient id="garage-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DE" />
      <stop offset="35%" stop-color="#FFD133" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#664700" />
    </linearGradient>
    <linearGradient id="car-bodywork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFE082" />
      <stop offset="60%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#5D4037" />
    </linearGradient>
    <linearGradient id="spotlight-cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD133" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFD133" stop-opacity="0" />
    </linearGradient>
    <clipPath id="garage-shield-left">
      <path d="M 256,70 L 90,105 C 50,115 45,210 50,300 C 55,395 180,445 256,460 Z" />
    </clipPath>
    <clipPath id="garage-shield-right">
      <path d="M 256,70 L 422,105 C 462,115 467,210 462,300 C 457,395 332,445 256,460 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Obsidian Chassis Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#0A0804" stroke="#2B1F0A" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#FFD133" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Outer Speed Shield Frame -->
  <g filter="url(#shadow-garage)">
    <path d="M 256,66 L 90,102 C 46,112 40,212 46,304 C 52,400 180,450 256,466 C 332,450 460,400 466,304 C 472,212 466,112 422,102 Z" fill="#141006" stroke="#FFD133" stroke-width="5" />

    <!-- LEFT WING: Carbon Fiber & Dyno Spec Readouts -->
    <g clip-path="url(#garage-shield-left)">
      <rect x="40" y="60" width="220" height="410" fill="#0C0A04" />
      <!-- Carbon Weave Lines -->
      <g opacity="0.10" stroke="#FFFFFF" stroke-width="2">
        <line x1="40" y1="120" x2="260" y2="120" />
        <line x1="40" y1="160" x2="260" y2="160" />
        <line x1="40" y1="200" x2="260" y2="200" />
        <line x1="40" y1="240" x2="260" y2="240" />
        <line x1="40" y1="280" x2="260" y2="280" />
        <line x1="40" y1="320" x2="260" y2="320" />
        <line x1="40" y1="360" x2="260" y2="360" />
      </g>
    </g>

    <!-- RIGHT WING: Architectural Studio Spotlight Beams -->
    <g clip-path="url(#garage-shield-right)">
      <rect x="256" y="60" width="220" height="410" fill="#141006" />
      <!-- Angled Volumetric Spotlights -->
      <polygon points="360,60 410,60 380,340 290,340" fill="url(#spotlight-cone)" />
      <polygon points="420,80 460,80 430,340 370,340" fill="url(#spotlight-cone)" opacity="0.5" />
    </g>

    <!-- Left Spotlight Cone (Over Left Wing) -->
    <polygon points="100,60 150,60 220,340 130,340" fill="url(#spotlight-cone)" opacity="0.6" />

    <!-- Center Line -->
    <line x1="256" y1="70" x2="256" y2="455" stroke="#FFD133" stroke-width="5" />
    <line x1="248" y1="75" x2="248" y2="450" stroke="#FFF9DE" stroke-width="2" />
    <line x1="264" y1="75" x2="264" y2="450" stroke="#997000" stroke-width="2" />

    <!-- 360° MOTORIZED SHOWROOM TURNTABLE PEDESTAL -->
    <g transform="translate(256, 335)">
      <!-- Base Turntable Rim Thickness (3D Cylinder Depth) -->
      <path d="M -180,25 C -180,60 -95,78 0,78 C 95,78 180,60 180,25 L 180,48 C 180,83 95,101 0,101 C -95,101 -180,83 -180,48 Z" fill="#1C1405" stroke="#FFD133" stroke-width="4" />

      <!-- Top Turntable Rotating Platter -->
      <ellipse cx="0" cy="25" rx="180" ry="52" fill="#241B08" stroke="url(#garage-gold)" stroke-width="6" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.85))" />
      <ellipse cx="0" cy="25" rx="150" ry="42" fill="#120D04" stroke="#5E450E" stroke-width="2.5" />

      <!-- 360° Circular Sweep Rotation Indicator Arrow -->
      <path d="M -130,22 C -90,7 90,7 130,22" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="10 8" fill="none" />
      <polygon points="126,16 142,22 128,29" fill="#FFFFFF" />

      <!-- Turntable Perimeter Grip Teeth -->
      <g stroke="#FFD133" stroke-width="3" opacity="0.6">
        <line x1="-165" y1="36" x2="-165" y2="52" />
        <line x1="-120" y1="52" x2="-120" y2="68" />
        <line x1="-60" y1="62" x2="-60" y2="78" />
        <line x1="0" y1="65" x2="0" y2="81" />
        <line x1="60" y1="62" x2="60" y2="78" />
        <line x1="120" y1="52" x2="120" y2="68" />
        <line x1="165" y1="36" x2="165" y2="52" />
      </g>
    </g>

    <!-- ULTRA-DETAILED GT SUPERCAR SILHOUETTE (Perched on Turntable) -->
    <g transform="translate(256, 305)" filter="drop-shadow(0 14px 20px rgba(0,0,0,0.95))">
      <!-- High-Performance Chassis Bodywork -->
      <path d="M -150,15 C -135,-4 -90,-8 -65,-8 L -35,-45 C -15,-62 35,-65 85,-58 L 130,-22 L 165,-2 C 178,5 180,18 172,25 L -148,25 C -156,25 -156,20 -150,15 Z" fill="url(#car-bodywork)" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" />

      <!-- Cockpit Tinted Glass Canopy -->
      <path d="M -30,-42 L 75,-54 C 95,-52 115,-35 122,-20 L -20,-20 Z" fill="#0A0804" stroke="#FFD133" stroke-width="2" />
      <!-- Visor reflection streak -->
      <path d="M 0,-44 L 60,-49 L 75,-25 L 20,-25 Z" fill="#FFFFFF" opacity="0.4" />

      <!-- Rear Aerodynamic Swan-Neck Wing -->
      <line x1="-148" y1="-8" x2="-120" y2="-8" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <line x1="-138" y1="-8" x2="-132" y2="10" stroke="#FFD133" stroke-width="3" />

      <!-- Front Splitter & Rear Diffuser Details -->
      <rect x="-155" y="22" width="22" height="6" rx="2" fill="#241B08" stroke="#FFFFFF" stroke-width="1.5" />
      <rect x="155" y="20" width="25" height="7" rx="2" fill="#241B08" stroke="#FFFFFF" stroke-width="1.5" />

      <!-- Front High-Performance Wheel & Rotor -->
      <g transform="translate(115, 25)">
        <circle cx="0" cy="0" r="28" fill="#0A0804" stroke="#FFD133" stroke-width="6" />
        <circle cx="0" cy="0" r="18" fill="#525B66" stroke="#FFFFFF" stroke-width="2" />
        <!-- Cross-Drilled Brake Rotor Holes -->
        <circle cx="-8" cy="-6" r="1.5" fill="#0A0804" />
        <circle cx="8" cy="-6" r="1.5" fill="#0A0804" />
        <circle cx="-8" cy="6" r="1.5" fill="#0A0804" />
        <circle cx="8" cy="6" r="1.5" fill="#0A0804" />
        <!-- Gold Caliper -->
        <path d="M 10,-12 C 16,-6 16,6 10,12" stroke="#FFD133" stroke-width="7" stroke-linecap="round" />
        <!-- Center Lug Nut -->
        <circle cx="0" cy="0" r="5" fill="#FFD133" />
      </g>

      <!-- Rear High-Performance Wheel & Rotor -->
      <g transform="translate(-95, 25)">
        <circle cx="0" cy="0" r="28" fill="#0A0804" stroke="#FFD133" stroke-width="6" />
        <circle cx="0" cy="0" r="18" fill="#525B66" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="-8" cy="-6" r="1.5" fill="#0A0804" />
        <circle cx="8" cy="-6" r="1.5" fill="#0A0804" />
        <circle cx="-8" cy="6" r="1.5" fill="#0A0804" />
        <circle cx="8" cy="6" r="1.5" fill="#0A0804" />
        <!-- Gold Caliper -->
        <path d="M 10,-12 C 16,-6 16,6 10,12" stroke="#FFD133" stroke-width="7" stroke-linecap="round" />
        <!-- Center Lug Nut -->
        <circle cx="0" cy="0" r="5" fill="#FFD133" />
      </g>
    </g>
  </g>
</svg>
