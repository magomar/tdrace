<svg id="emblem-track-editor" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-editor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#33FF66" flood-opacity="0.4" />
    </filter>
    <linearGradient id="cad-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#80FF9E" />
      <stop offset="75%" stop-color="#00C943" />
      <stop offset="100%" stop-color="#005C1E" />
    </linearGradient>
    <linearGradient id="steel-compass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#D6E4F0" />
      <stop offset="100%" stop-color="#6A7B8C" />
    </linearGradient>
    <clipPath id="editor-shield-left">
      <path d="M 256,70 L 90,105 C 50,115 45,210 50,300 C 55,395 180,445 256,460 Z" />
    </clipPath>
    <clipPath id="editor-shield-right">
      <path d="M 256,70 L 422,105 C 462,115 467,210 462,300 C 457,395 332,445 256,460 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Obsidian Chassis Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#060C08" stroke="#122417" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#33FF66" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Outer Speed Shield Frame -->
  <g filter="url(#shadow-editor)">
    <path d="M 256,66 L 90,102 C 46,112 40,212 46,304 C 52,400 180,450 256,466 C 332,450 460,400 466,304 C 472,212 466,112 422,102 Z" fill="#0B140E" stroke="#33FF66" stroke-width="5" />

    <!-- LEFT WING: Engineering Blueprint CAD Grid -->
    <g clip-path="url(#editor-shield-left)">
      <rect x="40" y="60" width="220" height="410" fill="#07100A" />
      <!-- Millimeter Grid Matrix -->
      <g stroke="#33FF66" stroke-width="1.5" opacity="0.25">
        <line x1="40" y1="120" x2="260" y2="120" />
        <line x1="40" y1="160" x2="260" y2="160" />
        <line x1="40" y1="200" x2="260" y2="200" />
        <line x1="40" y1="240" x2="260" y2="240" />
        <line x1="40" y1="280" x2="260" y2="280" />
        <line x1="40" y1="320" x2="260" y2="320" />
        <line x1="40" y1="360" x2="260" y2="360" />

        <line x1="80" y1="60" x2="80" y2="460" />
        <line x1="120" y1="60" x2="120" y2="460" />
        <line x1="160" y1="60" x2="160" y2="460" />
        <line x1="200" y1="60" x2="200" y2="460" />
        <line x1="240" y1="60" x2="240" y2="460" />
      </g>
    </g>

    <!-- RIGHT WING: Angle Protractor & Coordinate Arcs -->
    <g clip-path="url(#editor-shield-right)">
      <rect x="256" y="60" width="220" height="410" fill="#0C1A11" />
      <g stroke="#33FF66" stroke-width="1.5" fill="none" opacity="0.25">
        <circle cx="256" cy="270" r="140" stroke-dasharray="6 6" />
        <circle cx="256" cy="270" r="90" stroke-dasharray="4 4" />
        <!-- Radial Angle Markings -->
        <line x1="256" y1="270" x2="380" y2="190" />
        <line x1="256" y1="270" x2="390" y2="270" />
        <line x1="256" y1="270" x2="360" y2="350" />
      </g>
    </g>

    <!-- Center Line -->
    <line x1="256" y1="70" x2="256" y2="455" stroke="#33FF66" stroke-width="5" />
    <line x1="248" y1="75" x2="248" y2="450" stroke="#FFFFFF" stroke-width="2" />
    <line x1="264" y1="75" x2="264" y2="450" stroke="#008A2E" stroke-width="2" />

    <!-- 3D BANKING CIRCUIT RIBBON WITH BEZIER APEX -->
    <g filter="drop-shadow(0 10px 20px rgba(0,0,0,0.9))">
      <!-- Asphalt S-Curve Ribbon Track -->
      <path d="M 120,380 C 100,240 250,200 290,290 C 330,380 410,350 400,210" stroke="#142B1A" stroke-width="36" stroke-linecap="round" fill="none" />
      <path d="M 120,380 C 100,240 250,200 290,290 C 330,380 410,350 400,210" stroke="url(#cad-green-grad)" stroke-width="12" stroke-linecap="round" fill="none" />

      <!-- Red & White FIA Apex Curbs along Outside Apex -->
      <path d="M 230,220 C 270,225 300,265 315,320" stroke="#EF4444" stroke-width="6" fill="none" stroke-dasharray="10 10" />
      <path d="M 230,220 C 270,225 300,265 315,320" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-dasharray="10 10" stroke-dashoffset="10" />

      <!-- Active Bezier Spline Keyframe Nodes & Tangent Handles -->
      <!-- Node 1 (Entry) -->
      <rect x="106" y="366" width="28" height="28" rx="6" fill="#0E2415" stroke="#33FF66" stroke-width="4" />
      <circle cx="120" cy="380" r="5" fill="#FFFFFF" />

      <!-- Node 2 (Apex Keyframe with Tangent Handles) -->
      <g transform="translate(290, 290)">
        <!-- Tangent Line & Control Handles -->
        <line x1="-55" y1="-35" x2="55" y2="35" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="4 4" />
        <circle cx="-55" cy="-35" r="7" fill="#33FF66" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="55" cy="35" r="7" fill="#33FF66" stroke="#FFFFFF" stroke-width="2" />

        <!-- Apex Keyframe Square -->
        <rect x="-16" y="-16" width="32" height="32" rx="6" fill="#33FF66" stroke="#FFFFFF" stroke-width="4" filter="drop-shadow(0 0 8px #33FF66)" />
        <circle cx="0" cy="0" r="6" fill="#07100A" />
      </g>

      <!-- Node 3 (Exit) -->
      <rect x="386" y="196" width="28" height="28" rx="6" fill="#0E2415" stroke="#33FF66" stroke-width="4" />
      <circle cx="400" cy="210" r="5" fill="#FFFFFF" />
    </g>

    <!-- PRECISION DRAFTING COMPASS INSTRUMENT (Overlaying Top) -->
    <g transform="translate(256, 110)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.85))">
      <!-- Compass Head & Knurled Hinge Pivot -->
      <circle cx="0" cy="25" r="18" fill="#1B3822" stroke="url(#steel-compass)" stroke-width="4" />
      <circle cx="0" cy="25" r="8" fill="#33FF66" />
      <!-- Top Handle Stem -->
      <rect x="-5" y="0" width="10" height="15" rx="3" fill="url(#steel-compass)" />

      <!-- Left Leg (Needle Point, Aimed at Apex) -->
      <line x1="-10" y1="35" x2="-80" y2="155" stroke="url(#steel-compass)" stroke-width="10" stroke-linecap="round" />
      <polygon points="-80,155 -88,175 -72,170" fill="#FFFFFF" />

      <!-- Right Leg (Drafting Lead Pencil, Aimed at Canvas) -->
      <line x1="10" y1="35" x2="80" y2="140" stroke="url(#steel-compass)" stroke-width="10" stroke-linecap="round" />
      <polygon points="80,140 96,155 86,165" fill="#FFD133" stroke="#FFFFFF" stroke-width="1.5" />
      <polygon points="86,165 92,175 96,155" fill="#141E28" />

      <!-- Micro-Adjustment Crossbar & Wheel -->
      <line x1="-40" y1="90" x2="40" y2="85" stroke="#6A7B8C" stroke-width="5" />
      <circle cx="0" cy="88" r="9" fill="#FFD133" stroke="#FFFFFF" stroke-width="2" />
    </g>
  </g>
</svg>
