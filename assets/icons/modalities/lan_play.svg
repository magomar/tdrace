<svg id="emblem-lan-play" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-lan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#99A6BF" flood-opacity="0.35" />
    </filter>
    <linearGradient id="switch-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#C5D1E3" />
      <stop offset="70%" stop-color="#7B8DA8" />
      <stop offset="100%" stop-color="#374559" />
    </linearGradient>
    <clipPath id="lan-shield-left">
      <path d="M 256,70 L 90,105 C 50,115 45,210 50,300 C 55,395 180,445 256,460 Z" />
    </clipPath>
    <clipPath id="lan-shield-right">
      <path d="M 256,70 L 422,105 C 462,115 467,210 462,300 C 457,395 332,445 256,460 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Obsidian Chassis Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#070A10" stroke="#162030" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#99A6BF" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Outer Speed Shield Frame -->
  <g filter="url(#shadow-lan)">
    <path d="M 256,66 L 90,102 C 46,112 40,212 46,304 C 52,400 180,450 256,466 C 332,450 460,400 466,304 C 472,212 466,112 422,102 Z" fill="#0F1622" stroke="#99A6BF" stroke-width="5" />

    <!-- LEFT WING: Carbon Fiber & PCB Circuit Traces -->
    <g clip-path="url(#lan-shield-left)">
      <rect x="40" y="60" width="220" height="410" fill="#0A0E17" />
      <!-- Carbon Weave Lines -->
      <g opacity="0.10" stroke="#FFFFFF" stroke-width="2">
        <line x1="40" y1="120" x2="260" y2="120" />
        <line x1="40" y1="160" x2="260" y2="160" />
        <line x1="40" y1="200" x2="260" y2="200" />
        <line x1="40" y1="240" x2="260" y2="240" />
        <line x1="40" y1="280" x2="260" y2="280" />
        <line x1="40" y1="320" x2="260" y2="320" />
        <line x1="40" y1="360" x2="260" y2="360" />
      </g>
      <!-- Circuit Traces & Nodes -->
      <g stroke="#33D9FF" stroke-width="2" fill="none" opacity="0.4">
        <path d="M 60,180 L 120,180 L 150,210 L 150,270" />
        <circle cx="60" cy="180" r="4" fill="#33D9FF" />
        <path d="M 70,240 L 110,240 L 130,260" />
        <circle cx="70" cy="240" r="4" fill="#33D9FF" />
      </g>
    </g>

    <!-- RIGHT WING: Hexagonal Network Topology Matrix -->
    <g clip-path="url(#lan-shield-right)">
      <rect x="256" y="60" width="220" height="410" fill="#111A28" />
      <g stroke="#99A6BF" stroke-width="1.5" fill="none" opacity="0.25">
        <polygon points="320,160 350,140 380,160 380,200 350,220 320,200" />
        <polygon points="380,160 410,140 440,160 440,200 410,220 380,200" />
        <polygon points="350,220 380,200 410,220 410,260 380,280 350,260" />
      </g>
    </g>

    <!-- Center Line -->
    <line x1="256" y1="70" x2="256" y2="455" stroke="#99A6BF" stroke-width="5" />
    <line x1="248" y1="75" x2="248" y2="450" stroke="#FFFFFF" stroke-width="2" />
    <line x1="264" y1="75" x2="264" y2="450" stroke="#5E708A" stroke-width="2" />

    <!-- WI-FI / RF RADAR BROADCAST ARCS (Top) -->
    <g opacity="0.75" stroke="#33D9FF" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 180,125 C 225,95 287,95 332,125" />
      <path d="M 205,150 C 235,130 277,130 307,150" />
      <circle cx="256" cy="175" r="7" fill="#33D9FF" filter="drop-shadow(0 0 6px #33D9FF)" />
    </g>

    <!-- HIGH-DENSITY RACKMOUNT NETWORK SWITCH (Central) -->
    <g transform="translate(256, 250)">
      <!-- Main Metal Chassis Housing -->
      <rect x="-140" y="-45" width="280" height="90" rx="14" fill="#162030" stroke="url(#switch-chassis)" stroke-width="6" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.9))" />
      <rect x="-132" y="-37" width="264" height="74" rx="10" fill="#0B101A" />

      <!-- Heatsink Cooling Vents (Left) -->
      <g stroke="#28384F" stroke-width="3" stroke-linecap="round">
        <line x1="-115" y1="-20" x2="-115" y2="20" />
        <line x1="-105" y1="-20" x2="-105" y2="20" />
        <line x1="-95" y1="-20" x2="-95" y2="20" />
        <line x1="-85" y1="-20" x2="-85" y2="20" />
      </g>

      <!-- RJ-45 Ethernet Ports (Row of 6 High-Speed Ports) -->
      <g transform="translate(-60, -15)">
        <!-- Port 1 -->
        <rect x="0" y="0" width="22" height="30" rx="3" fill="#1C273A" stroke="#526888" stroke-width="1.5" />
        <rect x="4" y="20" width="14" height="8" fill="#0A0E17" />
        <circle cx="11" cy="-8" r="3.5" fill="#33FF66" filter="drop-shadow(0 0 4px #33FF66)" />

        <!-- Port 2 -->
        <rect x="30" y="0" width="22" height="30" rx="3" fill="#1C273A" stroke="#526888" stroke-width="1.5" />
        <rect x="34" y="20" width="14" height="8" fill="#0A0E17" />
        <circle cx="41" cy="-8" r="3.5" fill="#33D9FF" filter="drop-shadow(0 0 4px #33D9FF)" />

        <!-- Port 3 -->
        <rect x="60" y="0" width="22" height="30" rx="3" fill="#1C273A" stroke="#526888" stroke-width="1.5" />
        <rect x="64" y="20" width="14" height="8" fill="#0A0E17" />
        <circle cx="71" cy="-8" r="3.5" fill="#33D9FF" filter="drop-shadow(0 0 4px #33D9FF)" />

        <!-- Port 4 -->
        <rect x="90" y="0" width="22" height="30" rx="3" fill="#1C273A" stroke="#526888" stroke-width="1.5" />
        <rect x="94" y="20" width="14" height="8" fill="#0A0E17" />
        <circle cx="101" cy="-8" r="3.5" fill="#FFD133" filter="drop-shadow(0 0 4px #FFD133)" />

        <!-- Port 5 -->
        <rect x="120" y="0" width="22" height="30" rx="3" fill="#1C273A" stroke="#526888" stroke-width="1.5" />
        <rect x="124" y="20" width="14" height="8" fill="#0A0E17" />
        <circle cx="131" cy="-8" r="3.5" fill="#33FF66" filter="drop-shadow(0 0 4px #33FF66)" />

        <!-- Port 6 -->
        <rect x="150" y="0" width="22" height="30" rx="3" fill="#1C273A" stroke="#526888" stroke-width="1.5" />
        <rect x="154" y="20" width="14" height="8" fill="#0A0E17" />
        <circle cx="161" cy="-8" r="3.5" fill="#33D9FF" filter="drop-shadow(0 0 4px #33D9FF)" />
      </g>
    </g>

    <!-- FIBER-OPTIC BUS CONDUITS & 3 CLIENT RACING NODES -->
    <!-- Bus line drops -->
    <path d="M 256,295 L 256,335" stroke="#99A6BF" stroke-width="6" />
    <path d="M 140,335 L 372,335" stroke="#99A6BF" stroke-width="6" stroke-linecap="round" />

    <line x1="140" y1="335" x2="140" y2="365" stroke="#99A6BF" stroke-width="6" />
    <line x1="256" y1="335" x2="256" y2="365" stroke="#99A6BF" stroke-width="6" />
    <line x1="372" y1="335" x2="372" y2="365" stroke="#99A6BF" stroke-width="6" />

    <!-- Client Station 1 (Left) -->
    <g transform="translate(140, 390)">
      <rect x="-30" y="-22" width="60" height="44" rx="8" fill="#121A28" stroke="url(#switch-chassis)" stroke-width="3" />
      <rect x="-22" y="-15" width="44" height="24" rx="4" fill="#080D14" stroke="#33D9FF" stroke-width="1.5" />
      <circle cx="0" cy="-3" r="6" fill="#33D9FF" />
    </g>

    <!-- Client Station 2 (Center) -->
    <g transform="translate(256, 390)">
      <rect x="-30" y="-22" width="60" height="44" rx="8" fill="#121A28" stroke="url(#switch-chassis)" stroke-width="3" />
      <rect x="-22" y="-15" width="44" height="24" rx="4" fill="#080D14" stroke="#33FF66" stroke-width="1.5" />
      <circle cx="0" cy="-3" r="6" fill="#33FF66" />
    </g>

    <!-- Client Station 3 (Right) -->
    <g transform="translate(372, 390)">
      <rect x="-30" y="-22" width="60" height="44" rx="8" fill="#121A28" stroke="url(#switch-chassis)" stroke-width="3" />
      <rect x="-22" y="-15" width="44" height="24" rx="4" fill="#080D14" stroke="#FFD133" stroke-width="1.5" />
      <circle cx="0" cy="-3" r="6" fill="#FFD133" />
    </g>
  </g>
</svg>
