<svg id="emblem-split-screen" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-split" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#FF801A" flood-opacity="0.4" />
    </filter>
    <linearGradient id="split-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0E0" />
      <stop offset="35%" stop-color="#FF801A" />
      <stop offset="75%" stop-color="#CC4E00" />
      <stop offset="100%" stop-color="#662500" />
    </linearGradient>
    <clipPath id="split-shield-left">
      <path d="M 256,70 L 90,105 C 50,115 45,210 50,300 C 55,395 180,445 256,460 Z" />
    </clipPath>
    <clipPath id="split-shield-right">
      <path d="M 256,70 L 422,105 C 462,115 467,210 462,300 C 457,395 332,445 256,460 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Obsidian Chassis Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#0C0704" stroke="#2B1506" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#FF801A" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Outer Speed Shield Frame -->
  <g filter="url(#shadow-split)">
    <path d="M 256,66 L 90,102 C 46,112 40,212 46,304 C 52,400 180,450 256,466 C 332,450 460,400 466,304 C 472,212 466,112 422,102 Z" fill="#140B05" stroke="#FF801A" stroke-width="5" />

    <!-- LEFT WING: Carbon Fiber & 1P Orange HUD -->
    <g clip-path="url(#split-shield-left)">
      <rect x="40" y="60" width="220" height="410" fill="#0E0703" />
      <!-- Carbon Weave Lines -->
      <g opacity="0.10" stroke="#FFFFFF" stroke-width="2">
        <line x1="40" y1="120" x2="260" y2="120" />
        <line x1="40" y1="160" x2="260" y2="160" />
        <line x1="40" y1="200" x2="260" y2="200" />
        <line x1="40" y1="240" x2="260" y2="240" />
        <line x1="40" y1="280" x2="260" y2="280" />
        <line x1="40" y1="320" x2="260" y2="320" />
        <line x1="40" y1="360" x2="260" y2="360" />
      </g>
    </g>

    <!-- RIGHT WING: Checkered Flag Pattern & 2P Cyan HUD -->
    <g clip-path="url(#split-shield-right)">
      <rect x="256" y="60" width="220" height="410" fill="#170D06" />
      <g transform="translate(256, 80) skewX(-16)">
        <rect x="0" y="0" width="55" height="48" fill="#FFFFFF" />
        <rect x="55" y="0" width="55" height="48" fill="#0C0704" />
        <rect x="110" y="0" width="55" height="48" fill="#FFFFFF" />
        <rect x="165" y="0" width="55" height="48" fill="#0C0704" />

        <rect x="0" y="48" width="55" height="48" fill="#0C0704" />
        <rect x="55" y="48" width="55" height="48" fill="#FFFFFF" />
        <rect x="110" y="48" width="55" height="48" fill="#0C0704" />
        <rect x="165" y="48" width="55" height="48" fill="#FFFFFF" />

        <rect x="0" y="96" width="55" height="48" fill="#FFFFFF" />
        <rect x="55" y="96" width="55" height="48" fill="#0C0704" />
        <rect x="110" y="96" width="55" height="48" fill="#FFFFFF" />
        <rect x="165" y="96" width="55" height="48" fill="#0C0704" />

        <rect x="0" y="144" width="55" height="48" fill="#0C0704" />
        <rect x="55" y="144" width="55" height="48" fill="#FFFFFF" />
        <rect x="110" y="144" width="55" height="48" fill="#0C0704" />
        <rect x="165" y="144" width="55" height="48" fill="#FFFFFF" />

        <rect x="0" y="192" width="55" height="48" fill="#FFFFFF" />
        <rect x="55" y="192" width="55" height="48" fill="#0C0704" />
        <rect x="110" y="192" width="55" height="48" fill="#FFFFFF" />
        <rect x="165" y="192" width="55" height="48" fill="#0C0704" />
      </g>
    </g>

    <!-- DUAL SPLIT ARCADE VIEWPORTS (Side by Side) -->
    <!-- Heavy Bezel Housing -->
    <rect x="110" y="150" width="292" height="210" rx="20" fill="#1C0E06" stroke="url(#split-orange-grad)" stroke-width="8" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.9))" />

    <!-- Left Screen (Player 1) -->
    <rect x="122" y="162" width="128" height="186" rx="10" fill="#0A0502" />
    <!-- 1P Badge -->
    <g transform="translate(136, 185)">
      <rect x="-6" y="-14" width="34" height="20" rx="4" fill="#FF801A" />
      <text x="11" y="2" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">1P</text>
    </g>
    <!-- Left Screen Highway & Car -->
    <!-- Perspective road lines -->
    <line x1="186" y1="200" x2="140" y2="348" stroke="#3D2008" stroke-width="4" />
    <line x1="186" y1="200" x2="232" y2="348" stroke="#3D2008" stroke-width="4" />
    <!-- 1P Car Front Silhouette -->
    <g transform="translate(186, 280)">
      <path d="M -30,25 C -30,12 -22,4 -12,4 L 12,4 C 22,4 30,12 30,25 L 26,38 L -26,38 Z" fill="#FF801A" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M -16,4 L -10,-8 L 10,-8 L 16,4 Z" fill="#080402" stroke="#FFFFFF" stroke-width="1.5" />
      <!-- Glowing Headlights (Orange Beam) -->
      <polygon points="-26,24 -20,24 -22,29 -28,29" fill="#FFFFFF" filter="drop-shadow(0 0 6px #FF801A)" />
      <polygon points="26,24 20,24 22,29 28,29" fill="#FFFFFF" filter="drop-shadow(0 0 6px #FF801A)" />
    </g>

    <!-- Right Screen (Player 2) -->
    <rect x="262" y="162" width="128" height="186" rx="10" fill="#03070A" />
    <!-- 2P Badge -->
    <g transform="translate(352, 185)">
      <rect x="-6" y="-14" width="34" height="20" rx="4" fill="#33D9FF" />
      <text x="11" y="2" fill="#080F17" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">2P</text>
    </g>
    <!-- Right Screen Highway & Car -->
    <line x1="326" y1="200" x2="280" y2="348" stroke="#082030" stroke-width="4" />
    <line x1="326" y1="200" x2="372" y2="348" stroke="#082030" stroke-width="4" />
    <!-- 2P Car Front Silhouette (Neck-and-neck, slightly staggered) -->
    <g transform="translate(326, 270)">
      <path d="M -30,25 C -30,12 -22,4 -12,4 L 12,4 C 22,4 30,12 30,25 L 26,38 L -26,38 Z" fill="#33D9FF" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M -16,4 L -10,-8 L 10,-8 L 16,4 Z" fill="#03070A" stroke="#FFFFFF" stroke-width="1.5" />
      <!-- Glowing Headlights (Cyan Beam) -->
      <polygon points="-26,24 -20,24 -22,29 -28,29" fill="#FFFFFF" filter="drop-shadow(0 0 6px #33D9FF)" />
      <polygon points="26,24 20,24 22,29 28,29" fill="#FFFFFF" filter="drop-shadow(0 0 6px #33D9FF)" />
    </g>

    <!-- VERTICAL LASER SPLIT DIVIDER BEAM (Center) -->
    <line x1="256" y1="70" x2="256" y2="455" stroke="#FFFFFF" stroke-width="8" filter="drop-shadow(0 0 8px #FF801A)" />
    <line x1="256" y1="70" x2="256" y2="455" stroke="#FF801A" stroke-width="3" />

    <!-- DUAL ARCADE JOYSTICKS / CONTROLLER CONTROLS AT BASE -->
    <g transform="translate(200, 395)">
      <circle cx="0" cy="0" r="18" fill="#1C0E06" stroke="#FF801A" stroke-width="3" />
      <circle cx="0" cy="0" r="10" fill="#FF801A" />
      <line x1="0" y1="0" x2="-8" y2="-22" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
      <circle cx="-8" cy="-22" r="9" fill="#FF801A" stroke="#FFFFFF" stroke-width="2" />
    </g>
    <g transform="translate(312, 395)">
      <circle cx="0" cy="0" r="18" fill="#0A1624" stroke="#33D9FF" stroke-width="3" />
      <circle cx="0" cy="0" r="10" fill="#33D9FF" />
      <line x1="0" y1="0" x2="8" y2="-22" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
      <circle cx="8" cy="-22" r="9" fill="#33D9FF" stroke="#FFFFFF" stroke-width="2" />
    </g>
  </g>
</svg>
