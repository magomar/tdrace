<svg id="emblem-time-trial" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-time" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#FF33CC" flood-opacity="0.4" />
    </filter>
    <linearGradient id="chrono-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBF7" />
      <stop offset="35%" stop-color="#FF33CC" />
      <stop offset="75%" stop-color="#A80080" />
      <stop offset="100%" stop-color="#540040" />
    </linearGradient>
    <linearGradient id="ghost-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#33D9FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#33D9FF" stop-opacity="0.1" />
    </linearGradient>
    <clipPath id="time-shield-left">
      <path d="M 256,70 L 90,105 C 50,115 45,210 50,300 C 55,395 180,445 256,460 Z" />
    </clipPath>
    <clipPath id="time-shield-right">
      <path d="M 256,70 L 422,105 C 462,115 467,210 462,300 C 457,395 332,445 256,460 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Obsidian Chassis Backdrop -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#0C060B" stroke="#261021" stroke-width="6" />
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="#FF33CC" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Outer Speed Shield Frame -->
  <g filter="url(#shadow-time)">
    <path d="M 256,66 L 90,102 C 46,112 40,212 46,304 C 52,400 180,450 256,466 C 332,450 460,400 466,304 C 472,212 466,112 422,102 Z" fill="#140912" stroke="#FF33CC" stroke-width="5" />

    <!-- LEFT WING: Carbon Weave & Telemetry Timing Arcs -->
    <g clip-path="url(#time-shield-left)">
      <rect x="40" y="60" width="220" height="410" fill="#0E050D" />
      <g opacity="0.10" stroke="#FFFFFF" stroke-width="2">
        <line x1="40" y1="120" x2="260" y2="120" />
        <line x1="40" y1="160" x2="260" y2="160" />
        <line x1="40" y1="200" x2="260" y2="200" />
        <line x1="40" y1="240" x2="260" y2="240" />
        <line x1="40" y1="280" x2="260" y2="280" />
        <line x1="40" y1="320" x2="260" y2="320" />
        <line x1="40" y1="360" x2="260" y2="360" />
      </g>
      <!-- Telemetry Chrono concentric rings -->
      <circle cx="160" cy="270" r="120" stroke="#FF33CC" stroke-width="2" stroke-dasharray="6 8" fill="none" opacity="0.3" />
    </g>

    <!-- RIGHT WING: Checkered Flag & High Speed Trajectory -->
    <g clip-path="url(#time-shield-right)">
      <rect x="256" y="60" width="220" height="410" fill="#170A15" />
      <g transform="translate(256, 80) skewX(-16)">
        <rect x="0" y="0" width="55" height="48" fill="#FFFFFF" />
        <rect x="55" y="0" width="55" height="48" fill="#0C060B" />
        <rect x="110" y="0" width="55" height="48" fill="#FFFFFF" />
        <rect x="165" y="0" width="55" height="48" fill="#0C060B" />

        <rect x="0" y="48" width="55" height="48" fill="#0C060B" />
        <rect x="55" y="48" width="55" height="48" fill="#FFFFFF" />
        <rect x="110" y="48" width="55" height="48" fill="#0C060B" />
        <rect x="165" y="48" width="55" height="48" fill="#FFFFFF" />

        <rect x="0" y="96" width="55" height="48" fill="#FFFFFF" />
        <rect x="55" y="96" width="55" height="48" fill="#0C060B" />
        <rect x="110" y="96" width="55" height="48" fill="#FFFFFF" />
        <rect x="165" y="96" width="55" height="48" fill="#0C060B" />

        <rect x="0" y="144" width="55" height="48" fill="#0C060B" />
        <rect x="55" y="144" width="55" height="48" fill="#FFFFFF" />
        <rect x="110" y="144" width="55" height="48" fill="#0C060B" />
        <rect x="165" y="144" width="55" height="48" fill="#FFFFFF" />

        <rect x="0" y="192" width="55" height="48" fill="#FFFFFF" />
        <rect x="55" y="192" width="55" height="48" fill="#0C060B" />
        <rect x="110" y="192" width="55" height="48" fill="#FFFFFF" />
        <rect x="165" y="192" width="55" height="48" fill="#0C060B" />
      </g>
    </g>

    <!-- Center Line -->
    <line x1="256" y1="70" x2="256" y2="455" stroke="#FF33CC" stroke-width="5" />
    <line x1="248" y1="75" x2="248" y2="450" stroke="#FFEBF7" stroke-width="2" />
    <line x1="264" y1="75" x2="264" y2="450" stroke="#A80080" stroke-width="2" />

    <!-- HOLOGRAPHIC GHOST PB SHADOW CAR (Drafting out of Chrono Dial) -->
    <g transform="translate(256, 270) rotate(-28)" opacity="0.65">
      <!-- Ghost Particle Trail Streamers -->
      <path d="M -90,-20 Q -40,-80 80,-70" stroke="url(#ghost-cyan)" stroke-width="6" stroke-dasharray="12 8" fill="none" />
      <path d="M -80,20 Q -30,-40 90,-30" stroke="url(#ghost-cyan)" stroke-width="8" stroke-dasharray="14 10" fill="none" />

      <!-- Ghost Vehicle Wireframe Contour -->
      <path d="M 20,-50 C 40,-45 70,-40 90,-40 L 110,-20 C 125,-10 145,-5 160,-5 L 175,10 C 180,15 180,25 170,30 L 20,30 Z" fill="url(#ghost-cyan)" stroke="#33D9FF" stroke-width="2" />
      <circle cx="50" cy="30" r="14" fill="#0A1824" stroke="#33D9FF" stroke-width="3" />
      <circle cx="145" cy="30" r="14" fill="#0A1824" stroke="#33D9FF" stroke-width="3" />
    </g>

    <!-- PRECISION RALLY STOPWATCH / CHRONOMETER HOUSING -->
    <g transform="translate(256, 280)">
      <!-- Top Crown Push Button Assembly -->
      <rect x="-24" y="-195" width="48" height="36" rx="8" fill="url(#chrono-magenta)" stroke="#FFFFFF" stroke-width="3" />
      <rect x="-14" y="-160" width="28" height="20" fill="#360028" stroke="#FF33CC" stroke-width="2" />
      <!-- Left Split Lap Pusher (Angled -45 deg) -->
      <g transform="rotate(-45) translate(0, -170)">
        <rect x="-16" y="-18" width="32" height="28" rx="6" fill="url(#chrono-magenta)" stroke="#FFFFFF" stroke-width="2.5" />
      </g>
      <!-- Right Lap Reset Pusher (Angled 45 deg) -->
      <g transform="rotate(45) translate(0, -170)">
        <rect x="-16" y="-18" width="32" height="28" rx="6" fill="url(#chrono-magenta)" stroke="#FFFFFF" stroke-width="2.5" />
      </g>

      <!-- Main Chrono Dial Outer Bezel -->
      <circle cx="0" cy="0" r="145" fill="#1C0A19" stroke="url(#chrono-magenta)" stroke-width="12" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.9))" />
      <circle cx="0" cy="0" r="126" fill="#0A0409" stroke="#FFFFFF" stroke-width="2.5" />

      <!-- 60-Second Index Markings -->
      <!-- Cardinal 12, 3, 6, 9 -->
      <line x1="0" y1="-122" x2="0" y2="-98" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="122" y1="0" x2="98" y2="0" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="122" x2="0" y2="98" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="-122" y1="0" x2="-98" y2="0" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

      <!-- Intermediate 5-Sec Indices -->
      <line x1="61" y1="-105" x2="49" y2="-85" stroke="#FF33CC" stroke-width="4" stroke-linecap="round" />
      <line x1="105" y1="-61" x2="85" y2="-49" stroke="#FF33CC" stroke-width="4" stroke-linecap="round" />
      <line x1="105" y1="61" x2="85" y2="49" stroke="#FF33CC" stroke-width="4" stroke-linecap="round" />
      <line x1="61" y1="105" x2="49" y2="85" stroke="#FF33CC" stroke-width="4" stroke-linecap="round" />
      <line x1="-61" y1="105" x2="-49" y2="85" stroke="#FF33CC" stroke-width="4" stroke-linecap="round" />
      <line x1="-105" y1="61" x2="-85" y2="49" stroke="#FF33CC" stroke-width="4" stroke-linecap="round" />
      <line x1="-105" y1="-61" x2="-85" y2="-49" stroke="#FF33CC" stroke-width="4" stroke-linecap="round" />
      <line x1="-61" y1="-105" x2="-49" y2="-85" stroke="#FF33CC" stroke-width="4" stroke-linecap="round" />

      <!-- Minute Subdial at 12 o'clock -->
      <circle cx="0" cy="-45" r="34" fill="#140612" stroke="#FF33CC" stroke-width="2.5" />
      <line x1="0" y1="-45" x2="16" y2="-58" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

      <!-- Sweeping Chrono Second Needle (Pointing towards 1:42 angle) -->
      <line x1="0" y1="0" x2="78" y2="-68" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" filter="drop-shadow(0 0 6px #FFFFFF)" />
      <line x1="0" y1="0" x2="-22" y2="20" stroke="#FF33CC" stroke-width="8" stroke-linecap="round" />

      <!-- Center Axle Nut -->
      <circle cx="0" cy="0" r="16" fill="#0C030A" stroke="#FF33CC" stroke-width="4" />
      <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
    </g>
  </g>
</svg>
