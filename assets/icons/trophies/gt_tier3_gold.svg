<svg id="trophy-gt-tier3" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop Shadow and Ambient Glow -->
    <filter id="shadow-gt-t3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#EAB308" flood-opacity="0.4" />
    </filter>

    <!-- 24K Grand Prix Gold Gradients -->
    <linearGradient id="gold-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="90%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#543003" />
    </linearGradient>

    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <linearGradient id="gold-pedestal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B08" />
      <stop offset="50%" stop-color="#140F04" />
      <stop offset="100%" stop-color="#080602" />
    </linearGradient>

    <linearGradient id="gold-plate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <clipPath id="shield-clip-t3">
      <path d="M 256,32 L 432,80 C 462,190 450,330 256,480 C 62,330 50,190 80,80 Z" />
    </clipPath>
  </defs>

  <g filter="url(#shadow-gt-t3)">
    <!-- Base Shield -->
    <path d="M 256,30 L 434,78 C 466,190 454,332 256,484 C 58,332 46,190 78,78 Z"
          fill="#0C1017" stroke="#3D2B05" stroke-width="6" />

    <!-- Inner Shield Clip Area -->
    <g clip-path="url(#shield-clip-t3)">
      <rect x="40" y="20" width="432" height="470" fill="#080C12" />

      <!-- Carbon Weave Matrix -->
      <g opacity="0.09" stroke="#FFFFFF" stroke-width="1.8">
        <line x1="40" y1="60" x2="472" y2="60" />
        <line x1="40" y1="100" x2="472" y2="100" />
        <line x1="40" y1="140" x2="472" y2="140" />
        <line x1="40" y1="180" x2="472" y2="180" />
        <line x1="40" y1="220" x2="472" y2="220" />
        <line x1="40" y1="260" x2="472" y2="260" />
        <line x1="40" y1="300" x2="472" y2="300" />
        <line x1="40" y1="340" x2="472" y2="340" />
        <line x1="40" y1="380" x2="472" y2="380" />
      </g>

      <!-- Checkered Racing Wing Flags (Subtle Inlay) -->
      <g transform="translate(256, 70) skewX(-20)" opacity="0.12">
        <rect x="-140" y="0" width="40" height="35" fill="#FFFFFF" />
        <rect x="-60" y="0" width="40" height="35" fill="#FFFFFF" />
        <rect x="20" y="0" width="40" height="35" fill="#FFFFFF" />
        <rect x="100" y="0" width="40" height="35" fill="#FFFFFF" />

        <rect x="-100" y="35" width="40" height="35" fill="#FFFFFF" />
        <rect x="-20" y="35" width="40" height="35" fill="#FFFFFF" />
        <rect x="60" y="35" width="40" height="35" fill="#FFFFFF" />
        <rect x="140" y="35" width="40" height="35" fill="#FFFFFF" />

        <rect x="-140" y="70" width="40" height="35" fill="#FFFFFF" />
        <rect x="-60" y="70" width="40" height="35" fill="#FFFFFF" />
        <rect x="20" y="70" width="40" height="35" fill="#FFFFFF" />
        <rect x="100" y="70" width="40" height="35" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Beveled Gold Rim Stroke -->
    <path d="M 256,40 L 420,84 C 448,185 438,315 256,466 C 74,315 64,185 92,84 Z"
          fill="none" stroke="url(#gold-rim)" stroke-width="4" opacity="0.95" />
    <path d="M 256,50 L 410,90 C 434,180 424,302 256,450 C 88,302 78,180 102,90 Z"
          fill="none" stroke="#EAB308" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.6" />

    <!-- Modality GT Cyan Crown Wing -->
    <path d="M 180,60 L 256,42 L 332,60" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95" />

    <!-- FULL LAUREL WREATH (Both Sides Framing the Cup) -->
    <!-- Left Laurel Wreath -->
    <g stroke="url(#gold-rim)" stroke-width="3.5" fill="#241B08" stroke-linecap="round">
      <path d="M 152,360 C 104,315 96,200 148,140" fill="none" stroke-width="4.5" />
      <path d="M 138,335 C 112,335 106,310 130,318 Z" />
      <path d="M 122,290 C 98,280 98,255 120,268 Z" />
      <path d="M 114,240 C 92,225 100,200 120,218 Z" />
      <path d="M 120,190 C 102,170 118,145 134,170 Z" />
      <path d="M 138,150 C 128,130 150,115 160,140 Z" />
    </g>
    <!-- Right Laurel Wreath -->
    <g stroke="url(#gold-rim)" stroke-width="3.5" fill="#241B08" stroke-linecap="round">
      <path d="M 360,360 C 408,315 416,200 364,140" fill="none" stroke-width="4.5" />
      <path d="M 374,335 C 400,335 406,310 382,318 Z" />
      <path d="M 390,290 C 414,280 414,255 392,268 Z" />
      <path d="M 398,240 C 420,225 412,200 392,218 Z" />
      <path d="M 392,190 C 410,170 394,145 378,170 Z" />
      <path d="M 374,150 C 384,130 362,115 352,140 Z" />
    </g>

    <!-- ==================== TIER 3 GOLD TROPHY ==================== -->

    <!-- Swept Sculpted GT Wing Handles with Endplates -->
    <path d="M 180,180 C 105,170 98,270 190,290"
          stroke="url(#gold-rim)" stroke-width="15" stroke-linecap="round" fill="none" />
    <path d="M 180,180 C 115,170 110,262 190,280"
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />

    <path d="M 332,180 C 407,170 414,270 322,290"
          stroke="url(#gold-rim)" stroke-width="15" stroke-linecap="round" fill="none" />
    <path d="M 332,180 C 397,170 402,262 322,280"
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Main Cup Goblet Body -->
    <path d="M 176,145 L 336,145 C 336,245 300,305 256,318 C 212,305 176,245 176,145 Z"
          fill="url(#gold-body)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />

    <!-- Deep Specular Reflection Core -->
    <path d="M 216,147 C 216,228 238,295 256,316 C 274,295 296,228 296,147 Z"
          fill="#FFFDF0" opacity="0.3" />
    <line x1="256" y1="146" x2="256" y2="316" stroke="#FFFFFF" stroke-width="3" opacity="0.75" />

    <!-- Cup Rim Lip -->
    <ellipse cx="256" cy="145" rx="80" ry="18" fill="url(#gold-rim)" stroke="#FFFFFF" stroke-width="3.5" />
    <ellipse cx="256" cy="145" rx="64" ry="12" fill="#241B08" />

    <!-- Embossed Medallion: GT2 -->
    <circle cx="256" cy="226" r="30" fill="#171105" stroke="url(#gold-plate)" stroke-width="4" />
    <text x="256" y="234" fill="#FEF08A" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif"
          font-weight="900" font-size="20" text-anchor="middle" letter-spacing="1">GT2</text>

    <!-- Trophy Stem with Sculpted Rings -->
    <path d="M 238,318 L 274,318 L 270,356 L 242,356 Z"
          fill="url(#gold-body)" stroke="#FFFFFF" stroke-width="3" />
    <ellipse cx="256" cy="334" rx="22" ry="6" fill="#FFFFFF" opacity="0.85" />
    <ellipse cx="256" cy="348" rx="24" ry="6" fill="url(#gold-rim)" />

    <!-- Pedestal Base (Obsidian Carbon with Gold Filigree) -->
    <polygon points="216,356 296,356 304,372 208,372"
             fill="url(#gold-rim)" stroke="#FFFFFF" stroke-width="2.5" />
    <rect x="176" y="372" width="160" height="46" rx="5"
          fill="url(#gold-pedestal)" stroke="#EAB308" stroke-width="3.5" />

    <!-- Nameplate: POWER MASTERS -->
    <rect x="190" y="380" width="132" height="30" rx="3"
          fill="url(#gold-plate)" stroke="#FFFFFF" stroke-width="1.8" />
    <text x="256" y="393" fill="#1C1202" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif"
          font-weight="900" font-size="9.5" text-anchor="middle" letter-spacing="0.5">POWER MASTERS</text>
    <text x="256" y="405" fill="#422006" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif"
          font-weight="800" font-size="8" text-anchor="middle" letter-spacing="1.2">TIER III • GT2</text>

    <!-- Bottom Footing -->
    <rect x="152" y="418" width="208" height="14" rx="4"
          fill="#0F141C" stroke="#713F12" stroke-width="2.5" />

    <!-- ==================== TIER INDICATOR: 3 STARS ==================== -->
    <g transform="translate(256, 102)">
      <!-- Left Star -->
      <g transform="translate(-32, 4)">
        <polygon points="0,-16 4.7,-4.8 16,-4.8 7.3,1.8 10.6,12.8 0,6 -10.6,12.8 -7.3,1.8 -16,-4.8 -4.7,-4.8"
                 fill="url(#gold-rim)" stroke="#FFFFFF" stroke-width="1.5" />
        <polygon points="0,-11 3.2,-3.2 11,-3.2 5,1.2 7,8.6 0,4.2 -7,8.6 -5,1.2 -11,-3.2 -3.2,-3.2"
                 fill="#FFFDF0" opacity="0.8" />
      </g>
      <!-- Center Star (Largest) -->
      <g transform="translate(0, -4) scale(1.15)">
        <polygon points="0,-16 4.7,-4.8 16,-4.8 7.3,1.8 10.6,12.8 0,6 -10.6,12.8 -7.3,1.8 -16,-4.8 -4.7,-4.8"
                 fill="url(#gold-rim)" stroke="#FFFFFF" stroke-width="1.5" />
        <polygon points="0,-11 3.2,-3.2 11,-3.2 5,1.2 7,8.6 0,4.2 -7,8.6 -5,1.2 -11,-3.2 -3.2,-3.2"
                 fill="#FFFDF0" opacity="0.85" />
      </g>
      <!-- Right Star -->
      <g transform="translate(32, 4)">
        <polygon points="0,-16 4.7,-4.8 16,-4.8 7.3,1.8 10.6,12.8 0,6 -10.6,12.8 -7.3,1.8 -16,-4.8 -4.7,-4.8"
                 fill="url(#gold-rim)" stroke="#FFFFFF" stroke-width="1.5" />
        <polygon points="0,-11 3.2,-3.2 11,-3.2 5,1.2 7,8.6 0,4.2 -7,8.6 -5,1.2 -11,-3.2 -3.2,-3.2"
                 fill="#FFFDF0" opacity="0.8" />
      </g>
    </g>

    <!-- Roman Numeral 'III' Badge at Lower Crest -->
    <g transform="translate(256, 444)">
      <rect x="-26" y="-11" width="52" height="22" rx="3" fill="#1C1202" stroke="#EAB308" stroke-width="2" />
      <text x="256" y="455" fill="#FEF08A" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif"
            font-weight="900" font-size="11.5" text-anchor="middle">TIER III</text>
    </g>
  </g>
</svg>
