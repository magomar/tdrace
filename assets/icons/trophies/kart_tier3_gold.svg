<svg id="trophy-kart-tier3" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop Shadow and Neon Kart Glow -->
    <filter id="shadow-kart-t3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#CCFF00" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#EF4444" flood-opacity="0.3" />
    </filter>

    <!-- Karting 24K Gold -->
    <linearGradient id="kart-gold-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="90%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#543003" />
    </linearGradient>

    <!-- Chrome Expansion Chamber Gradients -->
    <linearGradient id="chrome-pipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="kart-pedestal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192608" />
      <stop offset="50%" stop-color="#0E1704" />
      <stop offset="100%" stop-color="#050A01" />
    </linearGradient>

    <clipPath id="shield-clip-kart">
      <path d="M 256,36 L 430,84 C 458,190 448,326 256,478 C 64,326 54,190 82,84 Z" />
    </clipPath>
  </defs>

  <g filter="url(#shadow-kart-t3)">
    <!-- Base Armor Shield Frame -->
    <path d="M 256,34 L 432,82 C 462,190 452,328 256,482 C 60,328 50,190 80,82 Z"
          fill="#090E04" stroke="#364A0B" stroke-width="6" />

    <!-- Inner Shield Clip Area -->
    <g clip-path="url(#shield-clip-kart)">
      <rect x="40" y="20" width="432" height="470" fill="#060A03" />

      <!-- ALTERNATING RED AND WHITE APEX RUMBLE CURBS (Framing Left and Right Edges) -->
      <!-- Left Curb Teeth -->
      <g>
        <polygon points="70,90 95,95 85,130 62,125" fill="#EF4444" />
        <polygon points="62,125 85,130 76,165 55,160" fill="#FFFFFF" />
        <polygon points="55,160 76,165 68,200 48,195" fill="#EF4444" />
        <polygon points="48,195 68,200 62,235 44,230" fill="#FFFFFF" />
        <polygon points="44,230 62,235 58,270 42,265" fill="#EF4444" />
        <polygon points="42,265 58,270 56,305 42,300" fill="#FFFFFF" />
      </g>
      <!-- Right Curb Teeth -->
      <g>
        <polygon points="442,90 417,95 427,130 450,125" fill="#EF4444" />
        <polygon points="450,125 427,130 436,165 457,160" fill="#FFFFFF" />
        <polygon points="457,160 436,165 444,200 464,195" fill="#EF4444" />
        <polygon points="464,195 444,200 450,235 468,230" fill="#FFFFFF" />
        <polygon points="468,230 450,235 454,270 470,265" fill="#EF4444" />
        <polygon points="470,265 454,270 456,305 470,300" fill="#FFFFFF" />
      </g>

      <!-- Neon Lime Kart Speed Band -->
      <g opacity="0.18">
        <polygon points="160,20 190,20 330,490 300,490" fill="#CCFF00" />
        <polygon points="205,20 225,20 365,490 345,490" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Inner Neon Lime Rim Stroke -->
    <path d="M 256,44 L 418,88 C 444,185 436,312 256,464 C 76,312 68,185 94,88 Z"
          fill="none" stroke="#CCFF00" stroke-width="4" opacity="0.95" />
    <path d="M 256,54 L 408,94 C 430,180 422,300 256,448 C 90,300 82,180 104,94 Z"
          fill="none" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="10 6" opacity="0.75" />

    <!-- Top Crown: Karting Wing Chevron -->
    <path d="M 180,64 L 256,44 L 332,64" stroke="#CCFF00" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 200,76 L 256,60 L 312,76" stroke="#EF4444" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- ==================== KARTING TROPHY CUP ==================== -->

    <!-- TUNED 2-STROKE EXHAUST EXPANSION CHAMBERS (Handles) -->
    <!-- Left Chamber Handle -->
    <path d="M 184,180 C 100,165 92,275 186,290"
          stroke="url(#chrome-pipe)" stroke-width="17" stroke-linecap="round" fill="none" />
    <path d="M 184,180 C 110,165 104,265 186,280"
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95" />

    <!-- Right Chamber Handle -->
    <path d="M 328,180 C 412,165 420,275 326,290"
          stroke="url(#chrome-pipe)" stroke-width="17" stroke-linecap="round" fill="none" />
    <path d="M 328,180 C 402,165 408,265 326,280"
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95" />

    <!-- Main Cup Body: 24K Gold Chalice -->
    <path d="M 176,145 L 336,145 C 336,245 300,305 256,318 C 212,305 176,245 176,145 Z"
          fill="url(#kart-gold-body)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />

    <!-- Specular Highlight -->
    <path d="M 216,147 C 216,228 238,295 256,316 C 274,295 296,228 296,147 Z"
          fill="#FFFDF0" opacity="0.32" />
    <line x1="256" y1="146" x2="256" y2="316" stroke="#FFFFFF" stroke-width="3" opacity="0.75" />

    <!-- Cup Rim Lip (Competition Kart Steering Wheel Rim) -->
    <ellipse cx="256" cy="145" rx="80" ry="18" fill="#1E293B" stroke="#CCFF00" stroke-width="3" />
    <ellipse cx="256" cy="145" rx="66" ry="12" fill="#0C1405" />

    <!-- Rev-Limiter LEDs on Top Rim -->
    <circle cx="236" cy="144" r="3" fill="#22C55E" />
    <circle cx="246" cy="143" r="3" fill="#EAB308" />
    <circle cx="256" cy="142" r="3.5" fill="#EF4444" />
    <circle cx="266" cy="143" r="3" fill="#EAB308" />
    <circle cx="276" cy="144" r="3" fill="#22C55E" />

    <!-- Embossed Medallion: 3-SPOKE KART STEERING WHEEL & KART MONOGRAM -->
    <circle cx="256" cy="226" r="30" fill="#0A1004" stroke="#CCFF00" stroke-width="4" />
    <!-- 3-Spoke Kart Steering Wheel Shape -->
    <line x1="256" y1="202" x2="256" y2="226" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="226" x2="234" y2="242" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="226" x2="278" y2="242" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <!-- Center Hub -->
    <circle cx="256" cy="226" r="8" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Trophy Stem with Anodized Gold Rings -->
    <path d="M 238,318 L 274,318 L 270,356 L 242,356 Z"
          fill="url(#kart-gold-body)" stroke="#FFFFFF" stroke-width="3" />
    <ellipse cx="256" cy="334" rx="22" ry="6" fill="#CCFF00" opacity="0.9" />
    <ellipse cx="256" cy="348" rx="24" ry="6" fill="#EF4444" />

    <!-- Pedestal Base: High-Rev Karting Base with Apex Curb Step -->
    <polygon points="216,356 296,356 304,372 208,372"
             fill="#CCFF00" stroke="#FFFFFF" stroke-width="2.5" />
    <rect x="176" y="372" width="160" height="46" rx="5"
          fill="url(#kart-pedestal)" stroke="#CCFF00" stroke-width="3.5" />

    <!-- Nameplate: CONTINENTAL TROPHY -->
    <rect x="190" y="380" width="132" height="30" rx="3"
          fill="#1A2908" stroke="#CCFF00" stroke-width="1.8" />
    <text x="256" y="393" fill="#CCFF00" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif"
          font-weight="900" font-size="9.5" text-anchor="middle" letter-spacing="0.5">CONTINENTAL TROPHY</text>
    <text x="256" y="405" fill="#FFFFFF" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif"
          font-weight="800" font-size="8" text-anchor="middle" letter-spacing="1.2">TIER III • KARTING</text>

    <!-- Bottom Footing Step with Alternating Red/White Curb Segments -->
    <rect x="152" y="418" width="208" height="14" rx="4"
          fill="#060A03" stroke="#EF4444" stroke-width="2.5" />

    <!-- ==================== TIER INDICATOR: 3 STARS ==================== -->
    <g transform="translate(256, 104)">
      <!-- Left Star -->
      <g transform="translate(-32, 4)">
        <polygon points="0,-16 4.7,-4.8 16,-4.8 7.3,1.8 10.6,12.8 0,6 -10.6,12.8 -7.3,1.8 -16,-4.8 -4.7,-4.8"
                 fill="#CCFF00" stroke="#FFFFFF" stroke-width="1.5" />
      </g>
      <!-- Center Star -->
      <g transform="translate(0, -4) scale(1.15)">
        <polygon points="0,-16 4.7,-4.8 16,-4.8 7.3,1.8 10.6,12.8 0,6 -10.6,12.8 -7.3,1.8 -16,-4.8 -4.7,-4.8"
                 fill="#CCFF00" stroke="#FFFFFF" stroke-width="1.5" />
      </g>
      <!-- Right Star -->
      <g transform="translate(32, 4)">
        <polygon points="0,-16 4.7,-4.8 16,-4.8 7.3,1.8 10.6,12.8 0,6 -10.6,12.8 -7.3,1.8 -16,-4.8 -4.7,-4.8"
                 fill="#CCFF00" stroke="#FFFFFF" stroke-width="1.5" />
      </g>
    </g>

    <!-- Roman Numeral 'III' Badge at Lower Crest -->
    <g transform="translate(256, 444)">
      <rect x="-26" y="-11" width="52" height="22" rx="3" fill="#142106" stroke="#CCFF00" stroke-width="2" />
      <text x="256" y="455" fill="#CCFF00" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif"
            font-weight="900" font-size="11.5" text-anchor="middle">TIER III</text>
    </g>
  </g>
</svg>
