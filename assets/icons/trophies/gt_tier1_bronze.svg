<svg id="trophy-gt-tier1" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop Shadow and Ambient Glow -->
    <filter id="shadow-gt-t1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#CD7F32" flood-opacity="0.25" />
    </filter>

    <!-- Bronze Gradients -->
    <linearGradient id="bronze-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4D6" />
      <stop offset="25%" stop-color="#E2945D" />
      <stop offset="60%" stop-color="#AF5F2C" />
      <stop offset="100%" stop-color="#642E0E" />
    </linearGradient>

    <linearGradient id="bronze-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE8DB" />
      <stop offset="50%" stop-color="#D4824C" />
      <stop offset="100%" stop-color="#803D14" />
    </linearGradient>

    <linearGradient id="bronze-pedestal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#362217" />
      <stop offset="50%" stop-color="#21150E" />
      <stop offset="100%" stop-color="#140C07" />
    </linearGradient>

    <linearGradient id="plate-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B86E3C" />
      <stop offset="50%" stop-color="#F2B78E" />
      <stop offset="100%" stop-color="#9E5728" />
    </linearGradient>

    <!-- Clip Paths for Shield Wings -->
    <clipPath id="shield-clip-t1">
      <path d="M 256,40 L 416,88 C 440,180 432,310 256,472 C 80,310 72,180 96,88 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Backdrop Shield Frame -->
  <g filter="url(#shadow-gt-t1)">
    <!-- Base Shield -->
    <path d="M 256,38 L 418,86 C 444,180 436,312 256,476 C 76,312 68,180 94,86 Z"
          fill="#0F141C" stroke="#2B1A12" stroke-width="6" />

    <!-- Inner Shield Clip Area -->
    <g clip-path="url(#shield-clip-t1)">
      <!-- Dark Carbon Texture Background -->
      <rect x="60" y="30" width="392" height="450" fill="#0C1017" />

      <!-- Horizontal Carbon Weave Grid -->
      <g opacity="0.07" stroke="#FFFFFF" stroke-width="2">
        <line x1="60" y1="80" x2="452" y2="80" />
        <line x1="60" y1="120" x2="452" y2="120" />
        <line x1="60" y1="160" x2="452" y2="160" />
        <line x1="60" y1="200" x2="452" y2="200" />
        <line x1="60" y1="240" x2="452" y2="240" />
        <line x1="60" y1="280" x2="452" y2="280" />
        <line x1="60" y1="320" x2="452" y2="320" />
        <line x1="60" y1="360" x2="452" y2="360" />
        <line x1="60" y1="400" x2="452" y2="400" />
      </g>

      <!-- Diagonal Racing Stripes (Bronze Clubman) -->
      <g opacity="0.12">
        <polygon points="120,40 180,40 340,480 280,480" fill="#CD7F32" />
        <polygon points="195,40 225,40 385,480 355,480" fill="#CD7F32" />
      </g>
    </g>

    <!-- Inner Metallic Rim Stroke -->
    <path d="M 256,48 L 406,92 C 430,176 422,298 256,456 C 90,298 82,176 106,92 Z"
          fill="none" stroke="url(#bronze-rim)" stroke-width="3" opacity="0.8" />
    <path d="M 256,58 L 396,98 C 418,172 410,286 256,440 C 102,286 94,172 116,98 Z"
          fill="none" stroke="#CD7F32" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.4" />

    <!-- MODALITY ACCENT BADGE: GT Cyan Pinstripe at Top Crown -->
    <path d="M 220,68 L 256,54 L 292,68" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- ==================== TIER 1 BRONZE TROPHY ==================== -->

    <!-- Trophy Handles (Aero Wing Endplate Style) -->
    <path d="M 188,185 C 130,185 125,255 192,275"
          stroke="url(#bronze-rim)" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 188,185 C 138,185 134,250 192,267"
          stroke="#FFE8DB" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

    <path d="M 324,185 C 382,185 387,255 320,275"
          stroke="url(#bronze-rim)" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 324,185 C 374,185 378,250 320,267"
          stroke="#FFE8DB" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Main Trophy Cup Body (Fluted GT Chalice) -->
    <path d="M 184,155 L 328,155 C 328,240 296,295 256,306 C 216,295 184,240 184,155 Z"
          fill="url(#bronze-body)" stroke="#FFE8DB" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Fluted Shadow / Highlight Core -->
    <path d="M 220,157 C 220,225 240,285 256,305 C 272,285 292,225 292,157 Z"
          fill="#FFE8DB" opacity="0.18" />
    <line x1="256" y1="156" x2="256" y2="305" stroke="#FFFFFF" stroke-width="2" opacity="0.45" />

    <!-- Cup Rim Ellipses -->
    <ellipse cx="256" cy="155" rx="72" ry="16" fill="url(#bronze-rim)" stroke="#FFE8DB" stroke-width="3" />
    <ellipse cx="256" cy="155" rx="56" ry="10" fill="#2E170A" />

    <!-- Central GT Modality Insignia: GT Silhouette & Star -->
    <circle cx="256" cy="226" r="26" fill="#1C1009" stroke="url(#plate-grad)" stroke-width="3" />
    <!-- GT Stylized Typography / Monogram -->
    <text x="256" y="233" fill="#FFE8DB" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif"
          font-weight="900" font-size="18" text-anchor="middle" letter-spacing="1">GT4</text>

    <!-- Trophy Stem -->
    <path d="M 242,306 L 270,306 L 267,345 L 245,345 Z"
          fill="url(#bronze-body)" stroke="#FFE8DB" stroke-width="2.5" />
    <!-- Stem Collar Ring -->
    <ellipse cx="256" cy="326" rx="18" ry="5" fill="#FFE8DB" opacity="0.7" />

    <!-- Pedestal Base (Brushed Dark Bronze Tiered Blocks) -->
    <!-- Upper Collar -->
    <polygon points="224,345 288,345 294,360 218,360"
             fill="url(#bronze-rim)" stroke="#FFE8DB" stroke-width="2" />
    <!-- Main Pedestal Block -->
    <rect x="186" y="360" width="140" height="42" rx="4"
          fill="url(#bronze-pedestal)" stroke="#CD7F32" stroke-width="3" />

    <!-- Pedestal Nameplate: CLUBMAN SPRINT CUP -->
    <rect x="198" y="368" width="116" height="26" rx="3"
          fill="url(#plate-grad)" stroke="#FFE8DB" stroke-width="1.5" />
    <text x="256" y="380" fill="#1A0D06" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif"
          font-weight="900" font-size="9" text-anchor="middle" letter-spacing="0.5">CLUBMAN SPRINT</text>
    <text x="256" y="390" fill="#3D1A07" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif"
          font-weight="800" font-size="7.5" text-anchor="middle" letter-spacing="1.2">TIER I • GT4</text>

    <!-- Sub-Base Step -->
    <rect x="168" y="402" width="176" height="12" rx="3"
          fill="#1C100A" stroke="#4A2511" stroke-width="2" />

    <!-- ==================== TIER INDICATOR: 1 STAR ==================== -->
    <g transform="translate(256, 114)">
      <!-- Outer Glow -->
      <circle cx="0" cy="0" r="18" fill="#CD7F32" opacity="0.3" />
      <!-- Star 1 (Center Bronze Star) -->
      <polygon points="0,-16 4.7,-4.8 16,-4.8 7.3,1.8 10.6,12.8 0,6 -10.6,12.8 -7.3,1.8 -16,-4.8 -4.7,-4.8"
               fill="url(#bronze-rim)" stroke="#FFE8DB" stroke-width="1.5" />
      <polygon points="0,-11 3.2,-3.2 11,-3.2 5,1.2 7,8.6 0,4.2 -7,8.6 -5,1.2 -11,-3.2 -3.2,-3.2"
               fill="#FFE8DB" opacity="0.6" />
    </g>

    <!-- Roman Numeral 'I' Badge at Lower Crest -->
    <g transform="translate(256, 432)">
      <rect x="-18" y="-10" width="36" height="20" rx="3" fill="#24150D" stroke="#CD7F32" stroke-width="2" />
      <text x="256" y="443" fill="#FFE8DB" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif"
            font-weight="900" font-size="12" text-anchor="middle">TIER I</text>
    </g>
  </g>
</svg>
