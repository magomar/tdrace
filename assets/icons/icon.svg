<svg id="svg-concept-3" class="w-full h-full icon-svg transition-all duration-300" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="mask-3"><rect id="clip-rect-3" width="512" height="512" rx="115" /></clipPath>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A24" />
      <stop offset="100%" stop-color="#080A0F" />
    </linearGradient>
    <filter id="shadow-3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="10" dy="16" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <g clip-path="url(#mask-3)">
    <rect width="512" height="512" fill="url(#bg-grad-3)" />

    <!-- Subtle Carbon Texture Lines -->
    <g opacity="0.04" stroke="#FFFFFF" stroke-width="2">
      <line x1="-100" y1="100" x2="600" y2="100" />
      <line x1="-100" y1="200" x2="600" y2="200" />
      <line x1="-100" y1="300" x2="600" y2="300" />
      <line x1="-100" y1="400" x2="600" y2="400" />
    </g>

    <!-- KINETIC ITALIC CHECKERED BAND -->
    <!-- Center container sheared at -22 degrees for extreme forward velocity -->
    <g transform="translate(256, 256) skewX(-24)" filter="url(#shadow-3)">
      
      <!-- Thick Checkered Grid: 3 rows x 5 columns (massive bold squares) -->
      <!-- Row 1: y = -105 to -35 (height 70) -->
      <rect x="-175" y="-105" width="70" height="70" fill="#FFFFFF" />
      <rect x="-105" y="-105" width="70" height="70" fill="#0A0E17" />
      <rect x="-35" y="-105" width="70" height="70" fill="#FFFFFF" />
      <rect x="35" y="-105" width="70" height="70" fill="#0A0E17" />
      <rect x="105" y="-105" width="70" height="70" fill="#FFFFFF" />

      <!-- Row 2: y = -35 to 35 (height 70) -->
      <rect x="-175" y="-35" width="70" height="70" fill="#0A0E17" />
      <rect x="-105" y="-35" width="70" height="70" fill="#FFFFFF" />
      <rect x="-35" y="-35" width="70" height="70" fill="#0A0E17" />
      <rect x="35" y="-35" width="70" height="70" fill="#FFFFFF" />
      <rect x="105" y="-35" width="70" height="70" fill="#0A0E17" />

      <!-- Row 3: y = 35 to 105 (height 70) -->
      <rect x="-175" y="35" width="70" height="70" fill="#FFFFFF" />
      <rect x="-105" y="35" width="70" height="70" fill="#0A0E17" />
      <rect x="-35" y="35" width="70" height="70" fill="#FFFFFF" />
      <rect x="35" y="35" width="70" height="70" fill="#0A0E17" />
      <rect x="105" y="35" width="70" height="70" fill="#FFFFFF" />

      <!-- Razor Sharp Accent Pinstripes (Pure Motorsport DNA) -->
      <!-- Top Red Stripe -->
      <rect x="-210" y="-120" width="420" height="8" fill="#EF4444" rx="2" />
      <!-- Bottom Red Stripe -->
      <rect x="-210" y="112" width="420" height="8" fill="#EF4444" rx="2" />
    </g>

    <!-- Speed Lines cutting across top and bottom -->
    <line x1="80" y1="80" x2="220" y2="80" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="300" y1="432" x2="440" y2="432" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4" />

    <rect width="512" height="512" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  </g>
</svg>