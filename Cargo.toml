[workspace]
resolver = "2"
members = [
    "crates/wheelbase",
    "crates/arcade-race-core",
    "crates/race-kit",
    "crates/race-ui",
    "crates/tdrace-core",
    "crates/tdrace-app",
    "crates/tdrace-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TDRace Team"]
license = "MIT OR Apache-2.0"

[patch."https://github.com/magomar/cabinet.git"]
cabinet = { path = "../cabinet/crates/cabinet" }
cabinet-core = { path = "../cabinet/crates/cabinet-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
