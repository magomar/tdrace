[workspace]
resolver = "2"
members = [
    "crates/wheelbase",
    "crates/arcade-race-core",
    "crates/tdrace-core",
    "crates/tdrace-app",
    "crates/tdrace-py",
    "crates/cabinet",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TDRace Team"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
