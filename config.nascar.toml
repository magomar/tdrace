# NASCAR Cup Series & Trans-Am TA1 Module Configuration
# Specific overrides here prevail over the general config.toml

[gameplay]
default_track = "daytona_superspeedway"
default_laps = 10
default_num_bots = 11
default_assist_profile = "arcade"

[camera]
velocity_lookahead_time = 0.45
position_smoothing = 9.0
zoom_smoothing = 4.2
trauma_decay = 2.0
max_shake_offset = 1.8

[audio]
master_volume = 1.0
sfx_volume = 0.95
music_volume = 0.70
