# IP Rename Registry - Single Source of Truth
# Spec: 047 (Fictional Branding and Real-World IP Removal for Steam Release)
# Purpose: Mapping table for automated rename passes and denylist testing.
# This file lives in docs/legal/ and is never shipped.

[meta]
version = "1.0.0"
spec = "047"
created = "2026-10-05"
description = "Single source of truth for real -> fictional assets and denylist verification."

[sprite_rules]
max_bodywork_colors = 3
strip_badges = true
strip_sponsor_decals = true
repair_mirrored_text_on_shifted = true
palette_excluded_components = ["tyres", "wheels", "suspension", "visible_motor_parts", "exhaust", "glass", "windshield"]

