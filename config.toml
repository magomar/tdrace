# ==============================================================================
# TDRACE - Modern Top-Down 2D Arcade Motorsport Configuration
# ==============================================================================
# Advanced players and modders can fine-tune vehicle physics, camera zoom levels,
# input filter response, sound mixer gains, and default race settings here.

[camera]
position_smoothing = 8.5
zoom_smoothing = 4.0
velocity_lookahead_time = 0.40
trauma_decay = 2.2
max_shake_offset = 1.5
default_level_index = 0

# Multi-level camera zoom modes (cycled in-game via Tab or Gamepad Left Stick Click)
[[camera.levels]]
name = "Close"
mode = "follow"
min_zoom = 13.5
max_zoom = 22.0

[[camera.levels]]
name = "Medium"
mode = "follow"
min_zoom = 10.0
max_zoom = 16.5

[[camera.levels]]
name = "Far"
mode = "follow"
min_zoom = 7.0
max_zoom = 11.5

[[camera.levels]]
name = "Overview"
mode = "overview"
min_zoom = 3.5
max_zoom = 3.5

[gameplay]
default_track = "classic_grand_prix"  # classic_grand_prix | oval_speedway | drift_park | kart_arena
default_car = "sports_car"            # sports_car | drift_car | kart | rally_car
default_laps = 3
default_num_bots = 3
default_assist_profile = "arcade"     # arcade | sport | pro

[input]
steer_rise_rate = 6.0
steer_return_rate = 10.0
steer_exponent = 1.35
speed_sensitive_factor = 0.018
min_speed_steer_limit = 0.38
throttle_rise_rate = 10.0
brake_rise_rate = 14.0

[audio]
master_volume = 0.85
sfx_volume = 0.90
music_volume = 0.70

